id: hld-rate-limiting
title: The Bot Swarm
summary: "A scraper hammers an exam-results site with 3,000 requests a second and real students can't get in. Build a token bucket, pick the right algorithm, and put the limiter in the right place."
world: reliability
order: 1
difficulty: 2
type: sandbox-sim
concepts: [rate-limiting]
prerequisites: [load-balancing]
minutes: 10
primaryVisual: architecture
whenNotToUse: "Limits that are too tight punish real users during legitimate peaks. Pair limits with capacity planning; they don't replace it."

rift:
  pain:
    scene: |
      **ResultHub** publishes exam results. At 10:00 a coaching centre's scraper starts pulling every roll number: **3,000 requests a second** from a handful of IPs, on top of 1,500 a second from real students.

      App servers sit at 188% and real students get timeouts. Adding servers costs a fortune and the scraper simply goes faster.
    prompt: "What's the right first move?"
    options:
      - text: "Rate-limit per client (IP, API key or user): allow normal use and reject the excess quickly with 429 Too Many Requests."
        outcome: "Cheap rejections at the edge protect expensive work behind it."
      - text: "Double the servers."
        outcome: "You'd be paying to serve the scraper."
      - text: "Turn the site off until the scraper stops."
        outcome: "Students need their results now."
    lesson: "A **rate limiter** caps how many requests each client can make in a time window and rejects the rest with **429** (and a `Retry-After` header). **Token bucket**: tokens refill at a steady rate up to a capacity; each request spends one, which allows short bursts. Other algorithms: **leaky bucket**, **fixed window**, **sliding window log** and **sliding window counter**. In a cluster, keep counters in a shared store like Redis."

  play:
    - kind: lab
      title: Tune the token bucket
      intro: Set the refill rate and bucket size so a real person's bursts get through but a scraper is throttled.
      widget: token-bucket
    - kind: sim
      title: Shield the results
      intro: "Keep average response under 110 ms and errors under 1% within ₹90k a month, even when the scrapers arrive."
      sim:
        knobs: [servers, rateLimit]
        start: { servers: 12, cache: true }
        goals: { avgMs: 110, errorPct: 1, budget: 90 }
        waves:
          - name: Results morning
            story: "1,500 students a second checking results."
            rps: 1500
            readRatio: 0.85
          - name: Scraper swarm
            story: "Same students, plus 3,000 requests a second from scrapers."
            rps: 1500
            readRatio: 0.85
            botRps: 3000
        solution: { servers: 12, cache: true, rateLimit: true }
    - kind: sort
      title: Which algorithm?
      intro: Match each requirement to the algorithm that fits best.
      buckets:
        - { id: token, label: Token bucket }
        - { id: leaky, label: Leaky bucket }
        - { id: fixed, label: Fixed window }
        - { id: sliding, label: Sliding window }
      items:
        - { id: bursts, text: "Allow short bursts (a page loads 10 assets at once) but cap the average", bucket: token, why: "Saved-up tokens allow bursts; the refill rate caps the average." }
        - { id: smooth, text: "Send requests to a fragile partner API at a perfectly steady pace", bucket: leaky, why: "A leaky bucket drains at a constant rate, smoothing output." }
        - { id: simple, text: "The simplest counter: 1,000 calls per calendar hour", bucket: fixed, why: "One counter per window; but allows 2x bursts at window edges." }
        - { id: edges, text: "No double bursts at minute boundaries, with accurate per-user limits", bucket: sliding, why: "Sliding windows smooth out the boundary problem." }
        - { id: api-tiers, text: "Free plan 100 requests a minute with bursts of 20", bucket: token, why: "Rate plus burst capacity map directly to token bucket parameters." }
    - kind: steps
      title: Put it in the right place
      intro: Design the limiter for a 20-server cluster.
      steps:
        - prompt: "Each of 20 servers keeps its own in-memory counter. What's the problem?"
          options:
            - text: "A client spread across servers gets 20× the limit. Keep counters in a shared store, like Redis with atomic INCR."
              correct: true
              feedback: "Or accept approximate local limits with sticky routing when precision doesn't matter."
            - text: "No real problem: the load balancer sends each client to the same server, so its counter there is accurate."
              feedback: "Balancers spread a client's requests across servers; limits must be global to mean anything."
        - prompt: "Where should the limiter run?"
          options:
            - text: "As early as possible: at the API gateway or edge, before requests reach expensive services."
              correct: true
              feedback: "Rejecting at the door is cheap; rejecting after a database query isn't."
            - text: "Inside each service, next to the expensive code it protects, so each team sets its own limits."
              feedback: "By then the request has already used the gateway, auth and service resources."
        - prompt: "What should a rejected client receive?"
          options:
            - text: "HTTP 429 with a `Retry-After` header and the limit details."
              correct: true
              feedback: "Well-behaved clients back off; it's also good API design."
            - text: "HTTP 503 Service Unavailable, so that the client backs off."
              feedback: "503 says the server is overloaded, not that this client is over its limit."

    - kind: code
      title: "Code it: a token bucket"
      intro: "Implement allow(nowMs). Refill tokens for the time since the last call (never above capacity), then spend one if available."
      hint: "tokens = Math.min(capacity, tokens + elapsedSeconds * refillPerSecond); remember to update this.last."
      starter: |
        class TokenBucket {
          constructor(capacity, refillPerSecond) {
            this.capacity = capacity;
            this.refillPerSecond = refillPerSecond;
            this.tokens = capacity; // starts full
            this.last = 0;          // time of the last refill, in ms
          }

          // Called for each request at time nowMs. Returns true if the request is allowed.
          allow(nowMs) {
            // TODO
            return true;
          }
        }
      solution: |
        class TokenBucket {
          constructor(capacity, refillPerSecond) {
            this.capacity = capacity;
            this.refillPerSecond = refillPerSecond;
            this.tokens = capacity;
            this.last = 0;
          }

          allow(nowMs) {
            const elapsed = (nowMs - this.last) / 1000;
            this.tokens = Math.min(this.capacity, this.tokens + elapsed * this.refillPerSecond);
            this.last = nowMs;
            if (this.tokens < 1) return false;
            this.tokens -= 1;
            return true;
          }
        }
      tests:
        - name: Allows a burst up to capacity
          code: |
            const b = new TokenBucket(3, 1);
            assert(b.allow(0) && b.allow(0) && b.allow(0), 'first three pass');
            assert(!b.allow(0), 'the fourth is rejected');
        - name: Refills over time
          code: |
            const b = new TokenBucket(3, 1);
            b.allow(0); b.allow(0); b.allow(0);
            assert(b.allow(1000), 'one token after a second');
            assert(!b.allow(1000), 'only one');
        - name: Never refills above capacity
          code: |
            const b = new TokenBucket(2, 1);
            b.allow(0); b.allow(0);
            assert(b.allow(60000) && b.allow(60000), 'two after a long idle');
            assert(!b.allow(60000), 'not sixty');
        - name: Keeps a steady rate
          code: |
            const b = new TokenBucket(1, 2);
            assert(b.allow(0));
            assert(b.allow(500), 'half a second refills one token at 2/s');
            assert(!b.allow(600));

  boss:
    name: The Swarm Queen
    taunt: "A thousand IPs, a million requests. Count them all, if you can."
    questions:
      - prompt: "Interviewer: “Design a rate limiter for an API.”"
        choices:
          - text: "Identify the client, use a token bucket in Redis with atomic updates, enforce it at the gateway, and return 429 with Retry-After."
            correct: true
            why: "Covers key, algorithm, storage, placement, response and failure mode."
          - text: "Count each client's requests in a global variable on every server, reset every minute by a scheduled job."
            why: "Breaks across servers and restarts: each server only sees its own share."
          - text: "Block IP addresses that send more than 100 requests in a second at the firewall."
            why: "Too crude: many users share one IP behind NAT, and you can't tell clients apart."
      - prompt: "What's the flaw of a fixed-window counter?"
        choices:
          - text: "A client can send the full limit at the end of one window and again just after: double the limit."
            correct: true
            why: "Sliding windows fix this."
          - text: "It needs a timestamp for every request in the window, so memory grows with traffic."
            why: "That's the sliding log. A fixed window keeps one counter per client."
          - text: "Counters drift when two servers increment them at the same moment."
            why: "Atomic increments fix that; the flaw is at the window boundary."
      - prompt: "Redis, which holds the counters, goes down. What should the limiter do?"
        choices:
          - text: "Usually fail open (allow traffic, maybe with local limits) so a limiter outage isn't a product outage; fail closed for login."
            correct: true
            why: "An explicit, per-endpoint decision."
          - text: "Fail closed everywhere: reject all requests until Redis is back, since unlimited traffic could overload the whole backend."
            why: "That turns a Redis hiccup into a full outage."
          - text: "Fall back to each server's in-memory counters, with the full limit per server."
            why: "Close, but per-server counters should use a fraction of the limit, and sensitive endpoints should fail closed."

  recall:
    kind: cloze
    prompt: Rate limiting from memory.
    text: "A rate limiter rejects excess requests with HTTP [[429]]. A [[token bucket]] refills at a steady rate and allows short bursts. A [[fixed window]] counter can allow double bursts at boundaries, which a [[sliding window]] fixes. In a cluster, counters live in a shared store like [[Redis]], enforced at the [[gateway]]."
    bank: ["429", token bucket, fixed window, sliding window, Redis, gateway, "500", round robin, database, cookie]

  codex:
    oneLiner: Cap each client's request rate, reject the excess cheaply with 429, and enforce it early with shared counters.
    analogy: "A bouncer with a hand-stamp machine that refills one stamp a second. Regulars get in, small groups are fine, but a bus of a hundred waits outside."
    keyPoints:
      - "Key by API key, user or IP; tiered limits per plan."
      - "Token bucket (bursts), leaky bucket (smooth), fixed window (simple), sliding window (accurate)."
      - "Shared counters in Redis with atomic ops and TTLs."
      - "Enforce at the gateway or edge; return 429 plus Retry-After."
      - "Decide fail-open vs fail-closed per endpoint."
    whenToUse:
      - "Public APIs, login and OTP endpoints, expensive searches, protecting partners."
    whenNotToUse:
      - As a substitute for capacity planning.
    interviewTells:
      - "“Design a rate limiter”, “prevent abuse”, “API quotas”, “bots”."
    pitfalls:
      - Per-server counters.
      - Limiting by IP behind carrier NAT (thousands of users share one IP).
      - No Retry-After.

  cards:
    - prompt: "Token bucket with capacity 10 and refill 1 per second. A client has been idle for a minute, then sends 15 requests at once. How many pass immediately?"
      choices:
        - text: "10: the bucket is full at capacity; the other 5 wait or are rejected."
          correct: true
          why: "Capacity caps the burst."
        - text: "15: a minute of idling saved up 60 tokens, more than enough for all of them."
          why: "Tokens don't accumulate beyond capacity."
        - text: "1 a second: the refill rate is the limit, so the other 14 wait their turn."
          why: "The saved tokens allow a burst up to capacity."
