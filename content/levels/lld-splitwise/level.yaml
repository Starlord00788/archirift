id: lld-splitwise
title: Design Splitwise
summary: "A Goa trip with 6 friends and 40 expenses: equal splits, exact splits, percentages. Model expenses and balances, then settle up in the fewest payments."
world: agency
order: 5
difficulty: 2
type: blueprint-puzzle
concepts: [splitwise]
prerequisites: [strategy, encapsulation]
minutes: 11
whenNotToUse: "For two people splitting one bill, you don't need a ledger; this design earns its keep with groups and many expenses."

rift:
  pain:
    scene: |
      Six friends go to Goa. Ritu tracks expenses in a spreadsheet: taxi split equally, hotel by room, a bar bill where Dev paid ₹3,000 of ₹5,000.

      By the end there are 40 rows, formulas referencing formulas, and everyone owes everyone. Settling takes 15 bank transfers and one friendship.
    prompt: "What does a good design need first?"
    options:
      - text: "A clear model: who paid, how it was split, and each person's running net balance."
        outcome: "With net balances, settling up becomes a small, well-defined algorithm."
      - text: "A fancier spreadsheet."
        outcome: "Formulas can't validate that exact splits add up to the total."
      - text: "Make everyone pay their own way."
        outcome: "That's not a trip, that's a business meeting."
    lesson: "Model an **Expense** (payer, amount, participants) with a pluggable **SplitStrategy** (equal, exact, percentage) that validates and produces each person's share. Keep a **net balance** per user per group. Then **settle up** greedily: match the biggest creditor with the biggest debtor until everything is zero."

  play:
    - kind: steps
      title: Model the money
      intro: Build the core of Splitwise.
      steps:
        - prompt: "How should equal, exact and percentage splits be modelled?"
          options:
            - text: "A `SplitStrategy` interface with `Map<User, Money> shares(Money total, List<SplitInput> inputs)` that validates its own rules (percentages sum to 100, exact amounts sum to the total)."
              correct: true
              feedback: "Each strategy owns its validation. Adding “by shares” is one class."
            - text: "A `type` field and a switch in `Expense`."
              feedback: "The Hydra returns."
          after:
            code:
              language: java
              source: |
                interface SplitStrategy {
                    Map<User, Money> shares(Money total, List<SplitInput> inputs);
                }

                class EqualSplit implements SplitStrategy {
                    public Map<User, Money> shares(Money total, List<SplitInput> in) {
                        // divide in paise; give the leftover paise to the first few people
                        long each = total.paise() / in.size(), extra = total.paise() % in.size();
                        Map<User, Money> out = new LinkedHashMap<>();
                        for (int i = 0; i < in.size(); i++) out.put(in.get(i).user(), Money.paise(each + (i < extra ? 1 : 0)));
                        return out;
                    }
                }
        - prompt: "How are balances stored?"
          options:
            - text: "A net balance per user per group: credit the payer the amount others owe them, debit each participant their share."
              correct: true
              feedback: "O(1) to update per participant, and settling only needs the net numbers."
            - text: "Recompute everything from all expenses on every page load."
              feedback: "That works for 40 expenses, but recomputing a 10,000-expense group on every page load is wasteful."
          after:
            diagram:
              nodes:
                - { id: Group }
                - { id: Expense, lines: ["payer, total"] }
                - { id: SplitStrategy, kind: interface }
                - { id: EqualSplit }
                - { id: PercentSplit }
                - { id: BalanceSheet, lines: ["user → net Money"] }
              edges:
                - { from: Group, to: Expense, type: composes }
                - { from: Group, to: BalanceSheet, type: composes }
                - { from: Expense, to: SplitStrategy, type: uses }
                - { from: EqualSplit, to: SplitStrategy, type: implements }
                - { from: PercentSplit, to: SplitStrategy, type: implements }
        - prompt: "Money: ₹100 split three ways. How do you avoid ₹33.333…?"
          options:
            - text: "Store money as integer paise and give the leftover paise to some participants deterministically."
              correct: true
              feedback: "₹33.34 + ₹33.33 + ₹33.33. Never use floating point for money."
            - text: "Use `double` and round at display time."
              feedback: "Rounding errors pile up and balances stop summing to zero."
        - prompt: "Settle up: net balances are A +₹500, B −₹300, C −₹200. Fewest payments?"
          options:
            - text: "Greedy: the largest debtor pays the largest creditor as much as possible, then repeat. B pays A ₹300, C pays A ₹200."
              correct: true
              feedback: "Two payments. The greedy approach gives at most n − 1 transfers (a true minimum is NP-hard in general, but greedy is the standard interview answer)."
            - text: "Everyone pays everyone their pairwise debts."
              feedback: "That's the 15-transfer mess."
    - kind: order
      title: Settle the Goa trip
      intro: "Net balances: Ritu +₹1200, Dev +₹300, Asha −₹900, Kabir −₹600. Order the greedy settlement steps."
      items:
        - { id: sort, text: "Split users into creditors (Ritu 1200, Dev 300) and debtors (Asha 900, Kabir 600), largest first" }
        - { id: p1, text: "Asha pays Ritu ₹900. Ritu still needs ₹300" }
        - { id: p2, text: "Kabir pays Ritu ₹300. Ritu is settled; Kabir still owes ₹300" }
        - { id: p3, text: "Kabir pays Dev ₹300. Everyone is at zero" }

  boss:
    name: The Ledger Lich
    taunt: "₹33.333… repeating forever. Your balances will never sum to zero."
    questions:
      - prompt: "Interviewer: “How do you represent money?”"
        choices:
          - text: "As integer minor units (paise) or `BigDecimal` with explicit rounding, never `double`."
            correct: true
            why: "Floating point can't represent 0.1 exactly; sums drift."
          - text: "As a `float` for speed."
            why: "Rounding bugs in money cost trust."
          - text: "As a String."
            why: "No arithmetic, no validation."
      - prompt: "Why do the net balances in a group always sum to zero?"
        choices:
          - text: "Every expense credits the payer exactly what it debits the participants, so the books balance. It's a good invariant to assert."
            correct: true
            why: "Double-entry thinking."
          - text: "Coincidence."
            why: "It's a guaranteed invariant."
          - text: "They don't."
            why: "If they don't, there's a bug."
      - prompt: "Which pattern makes adding a “split by shares” mode painless?"
        choices:
          - text: "Strategy: implement `SharesSplit` behind the `SplitStrategy` interface."
            correct: true
            why: "No change to Expense or Group."
          - text: "Singleton."
            why: "Unrelated."
          - text: "Facade."
            why: "Facade could wrap the app's API, but it doesn't add split modes."

  recall:
    kind: blueprint
    prompt: Rebuild the Splitwise core model.
    palette: [Group, Expense, SplitStrategy, EqualSplit, PercentSplit, BalanceSheet, User, SplitType, ExpenseUtils]
    relations: [composes, uses, implements, has]
    kinds: { SplitStrategy: interface }
    reference:
      nodes: [Group, Expense, SplitStrategy, EqualSplit, PercentSplit, BalanceSheet]
      edges:
        - { from: Group, to: Expense, type: composes }
        - { from: Group, to: BalanceSheet, type: composes }
        - { from: Expense, to: SplitStrategy, type: uses }
        - { from: EqualSplit, to: SplitStrategy, type: implements }
        - { from: PercentSplit, to: SplitStrategy, type: implements }
    acceptedExtras:
      nodes: [User]
      edges:
        - { from: Expense, to: User, type: has }
        - { from: Group, to: User, type: has }

  codex:
    oneLiner: Expenses with pluggable split strategies update per-user net balances; settle up by greedily matching the largest debtors and creditors.
    analogy: "A trip kitty notebook. Write who paid what and for whom; at the end, look only at who's up and who's down, and do a few transfers instead of untangling every bill."
    keyPoints:
      - "Entities: User, Group, Expense, Split, BalanceSheet."
      - "SplitStrategy: equal, exact, percent, shares, each validating itself."
      - "Money as integer paise; deterministic remainder distribution."
      - "Net balances sum to zero (an invariant)."
      - "Greedy settlement with heaps: at most n − 1 transfers."
    whenToUse:
      - LLD rounds; any shared-ledger or bill-splitting problem.
    whenNotToUse:
      - "Real accounting needs audit trails, currencies and taxes; mention them as extensions."
    interviewTells:
      - "“Design Splitwise”, “expense sharing”, “simplify debts”."
    pitfalls:
      - Floating-point money.
      - Exact splits that don't sum to the total, accepted without validation.

  cards:
    - prompt: "₹100 split equally among 3 people, in paise. What are the shares?"
      choices:
        - text: "3334, 3333 and 3333 paise."
          correct: true
          why: "Integer division plus distributing the remainder."
        - text: "3333.33 each."
          why: "Fractions of a paisa don't exist."
        - text: "3333 each, losing a paisa."
          why: "The books wouldn't balance."
