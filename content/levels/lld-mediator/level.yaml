id: lld-mediator
title: Air Traffic Control
summary: In a group-chat app, every user object calls every other user object directly, so 50 people means 2,450 connections. Route conversations through a mediator instead.
world: behavioral
order: 8
difficulty: 2
type: refactor-rush
concepts: [mediator]
prerequisites: [observer]
minutes: 7
whenNotToUse: "A mediator can turn into a god object. If components only talk to one or two others, direct references are simpler."

rift:
  pain:
    scene: |
      **ClassChat** lets a class group chat. Each `User` object holds a list of every other `User` and calls `receive()` on each one.

      With 50 students that's 2,450 references. Muting someone means editing 49 lists, and adding "the CR can pin messages" touches every user.
    code:
      language: java
      source: |
        class User {
            List<User> others;               // everyone else, directly
            void send(String msg) {
                for (User u : others) {
                    if (!u.hasMuted(this)) u.receive(this, msg);
                }
            }
        }
    prompt: "What's the core problem?"
    options:
      - text: "Peers are wired many-to-many, so every rule (mute, pin, moderation) is spread across all of them."
        outcome: "n × (n − 1) connections, and every interaction rule duplicated in every object."
      - text: "Too many students in one class."
        outcome: "Fifty is a normal class; the design should cope."
      - text: "Chat should use email."
        outcome: "Nobody wants reply-all with 50 people."
    lesson: "A **Mediator** centralises how a set of objects interact. Users only know the `ChatRoom`; the room decides who receives what, applying mute, pin and moderation rules in one place. Many-to-many becomes many-to-one."

  play:
    - kind: steps
      title: Install the control tower
      intro: Route all messages through a mediator.
      steps:
        - prompt: "Who should users talk to?"
          options:
            - text: "Only a `ChatRoom` mediator: `room.send(this, msg)`."
              correct: true
              feedback: "Each user has one reference, to the room."
            - text: "Still every other user, but through a shared helper class."
              feedback: "The many-to-many web remains."
          after:
            code:
              language: java
              source: |
                interface ChatMediator { void send(User from, String msg); void join(User u); }

                class ChatRoom implements ChatMediator {
                    private final List<User> members = new ArrayList<>();
                    private final Map<User, Set<User>> mutes = new HashMap<>();

                    public void join(User u) { members.add(u); }
                    public void send(User from, String msg) {
                        for (User u : members) {
                            if (u != from && !mutes.getOrDefault(u, Set.of()).contains(from)) u.receive(from, msg);
                        }
                    }
                }

                class User {
                    private final ChatMediator room;
                    void send(String msg) { room.send(this, msg); }
                    void receive(User from, String msg) { /* show it */ }
                }
            diagram:
              nodes:
                - { id: Asha }
                - { id: Ravi }
                - { id: Zoya }
                - { id: ChatRoom, lines: ["mute rules", "pins"] }
              edges:
                - { from: Asha, to: ChatRoom, type: uses }
                - { from: Ravi, to: ChatRoom, type: uses }
                - { from: Zoya, to: ChatRoom, type: uses }
        - prompt: "Where does “the CR can pin messages” go?"
          options:
            - text: "In the `ChatRoom`: it's an interaction rule, so the mediator owns it."
              correct: true
              feedback: "One place for collaboration rules. Users stay simple."
            - text: "In the CR's own `User` object, as an extra method only it has."
              feedback: "Then pinning rules live in a user class; the room should own interaction rules."
        - prompt: "Mediator vs Observer: which statement is right?"
          options:
            - text: "Observer broadcasts one subject's changes; Mediator coordinates two-way interactions among peers and holds the rules."
              correct: true
              feedback: "A mediator often uses observer-style notifications internally."
            - text: "Mediator broadcasts one subject's changes to subscribers; Observer coordinates many peers and holds all their rules."
              feedback: "Swapped: Observer broadcasts, Mediator coordinates."
    - kind: sort
      title: Mediators everywhere
      intro: Which of these is a mediator?
      buckets:
        - { id: mediator, label: Mediator }
        - { id: other, label: Not a mediator }
      items:
        - { id: atc, text: "Air traffic control coordinating planes, which never radio each other directly", bucket: mediator, why: "The canonical analogy." }
        - { id: form, text: "A form controller that enables “Submit” only when the fields are valid, and resets the city when the country changes", bucket: mediator, why: "Widgets talk through the dialog, not to each other." }
        - { id: broker, text: "A matchmaking service pairing riders and drivers", bucket: mediator, why: "It coordinates two sides that don't know each other." }
        - { id: decorator, text: "Adding gzip compression around an output stream", bucket: other, why: "That's Decorator." }

  boss:
    name: The Tangled Web
    taunt: "Everyone knows everyone. Isn't that friendly? Now try changing one rule."
    questions:
      - prompt: "Interviewer: “What does Mediator reduce?”"
        choices:
          - text: "Coupling between many collaborators: n × (n − 1) direct links become n links to one mediator."
            correct: true
            why: "Interaction logic is centralised."
          - text: "The number of messages sent between peers, since the mediator batches and de-duplicates them together."
            why: "Messages still flow; what shrinks is the web of references."
          - text: "The number of classes, since peers merge into the mediator."
            why: "It adds one class."
      - prompt: "What's Mediator's main risk?"
        choices:
          - text: "It can grow into a god object holding all the system's logic."
            correct: true
            why: "Keep mediators focused on coordination; split by area if they grow."
          - text: "Peers can no longer be tested on their own without the real mediator."
            why: "Mediators are usually interfaces, so a fake works fine in tests."
          - text: "Every peer must extend a mediator base class."
            why: "It doesn't."
      - prompt: "Which architecture component plays a mediator role between microservices?"
        choices:
          - text: "An orchestrator in a saga, or a broker coordinating services."
            correct: true
            why: "It coordinates without services calling each other directly."
          - text: "A read replica that several services all share for their queries."
            why: "Replicas copy data; they don't coordinate interactions."
          - text: "A shared client library."
            why: "A library is code each service runs; nothing coordinates them."

  recall:
    kind: cloze
    prompt: Mediator from memory.
    text: "A Mediator replaces [[many-to-many]] references between peers with references to one central object. Peers send messages to the [[mediator]], which applies interaction [[rules]] and forwards them. The main risk is that it grows into a [[god object]]. Unlike Observer, which [[broadcasts]] one subject's changes, Mediator coordinates two-way interactions."
    bank: [many-to-many, mediator, rules, god object, broadcasts, one-to-one, singleton, factory, inheritance, caches]

  codex:
    oneLiner: Centralise how a group of objects interact, so they talk to one mediator instead of to each other.
    analogy: "Air traffic control. Pilots don't negotiate runways with each other; they talk to the tower, which coordinates everyone."
    keyPoints:
      - Peers know only the mediator interface.
      - Interaction rules live in one place.
      - n×(n−1) connections become n.
      - Often uses Observer-style notifications internally.
      - "Risk: god object; keep it focused."
    whenToUse:
      - "Chat rooms, form dialogs, game lobbies, matchmaking, workflow orchestration."
    whenNotToUse:
      - Few, simple, stable interactions.
    interviewTells:
      - "“Chat room design”, “components shouldn't know each other”, “air traffic control”."
    pitfalls:
      - Business logic of every peer creeping into the mediator.

  cards:
    - prompt: "With 100 users in a chat room using a mediator, how many references does each user hold to other chat participants?"
      choices:
        - text: "One, to the mediator"
          correct: true
          why: "Instead of 99 peers."
        - text: "99, one per peer"
          why: That's the direct design.
        - text: "Two: room and server"
          why: "Only the room; the server is the room's concern."
