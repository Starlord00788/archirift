id: hld-idempotency
title: The Double Charge
summary: "A student taps “Pay ₹500” on a flaky train Wi-Fi. The request times out, the app retries, and they're charged twice. Learn idempotency keys, delivery guarantees, the outbox pattern and safe retries."
world: messaging
order: 4
difficulty: 3
type: refactor-rush
concepts: [idempotency]
prerequisites: [message-queue]
minutes: 10
primaryVisual: architecture
whenNotToUse: "Naturally idempotent operations (GET, PUT of a full value, DELETE by id) don't need extra keys; reserve idempotency keys for creates and side effects like charges and emails."

rift:
  pain:
    scene: |
      **FeePay** collects hostel fees. Riya taps **Pay ₹500** on a train. The request reaches the server and the charge succeeds, but the response is lost in a tunnel.

      The app sees a timeout and retries automatically. The server, seeing a fresh request, charges her again. ₹1,000 gone, one angry email.
    prompt: "Where's the real bug?"
    options:
      - text: "The server can't tell a retry from a new payment, so the operation isn't idempotent."
        outcome: "Retries are necessary on unreliable networks. The server must make them safe."
      - text: "The app shouldn't retry."
        outcome: "Then lost requests are never completed. Retries are fine; duplicates aren't."
      - text: "Trains should have better Wi-Fi."
        outcome: "Networks will always fail somewhere."
    lesson: "An operation is **idempotent** if doing it twice has the same effect as doing it once. The client sends an **idempotency key** (a unique id per intended action); the server stores the key with the result and returns the stored result for repeats. Networks give **at-least-once** delivery at best, so retries plus idempotency give **effectively-once** results."

  play:
    - kind: steps
      title: Make payments safe to retry
      intro: Fix FeePay step by step.
      steps:
        - prompt: "Who generates the idempotency key, and when?"
          options:
            - text: "The client, once per intent (when Riya taps Pay), reused on every retry."
              correct: true
              feedback: "A new key per attempt would defeat the purpose."
            - text: "The server, for each request it receives, so that clients can't forge keys."
              feedback: "Then a retry gets a new key and looks like a new payment."
          after:
            code:
              language: http
              source: |
                POST /payments
                Idempotency-Key: 7f3c9e2a-41b0-4c55-9d1e-2b8f6a0c1d77
                Content-Type: application/json

                { "studentId": "S1042", "amountPaise": 50000 }
        - prompt: "What does the server do with the key?"
          options:
            - text: "Insert the key under a unique constraint in the same transaction; if it exists, return the stored response."
              correct: true
              feedback: "The unique constraint makes the check-and-insert atomic, even when two retries arrive at once."
            - text: "Look the key up in Redis; if it isn't there, charge the card and then store the key with a 24-hour TTL on it."
              feedback: "Two concurrent retries can both miss Redis and both charge; you need an atomic guard."
          after:
            code:
              language: sql
              source: |
                CREATE TABLE idempotency_keys (
                  key          UUID PRIMARY KEY,      -- duplicate inserts fail atomically
                  request_hash TEXT NOT NULL,         -- reject the same key with a different body
                  response     JSONB,
                  created_at   TIMESTAMPTZ DEFAULT now()  -- expire after, say, 24 hours
                );
        - prompt: "The payment is saved, and now an event `PaymentSucceeded` must reach Kafka. The service crashes between the database commit and the publish. Fix?"
          options:
            - text: "The outbox pattern: write the event to an `outbox` table in the same transaction; a relay publishes it."
              correct: true
              feedback: "The database write and the 'intent to publish' commit atomically. Consumers dedupe by event id."
            - text: "Publish the event first, then commit the payment, so Kafka never misses a successful payment."
              feedback: "Now a crash leaves an event for a payment that doesn't exist."
        - prompt: "The app retries 3 times in 100 ms whenever anything fails. What's wrong?"
          options:
            - text: "Use exponential backoff with jitter and a cap, and retry only retryable errors (timeouts, 503), never a 400."
              correct: true
              feedback: "Synchronised instant retries turn a blip into a self-inflicted outage."
            - text: "Nothing: retrying fast means the user waits less, and three attempts is a sensible limit for any error."
              feedback: "Fast retries amplify load exactly when the server is struggling, and a 400 will never succeed."
    - kind: sort
      title: Idempotent by nature?
      intro: "Is each operation idempotent as written, or does it need a key or a redesign?"
      buckets:
        - { id: safe, label: Already idempotent }
        - { id: unsafe, label: Needs a key or a redesign }
      items:
        - { id: get, text: "`GET /orders/42`", bucket: safe, why: "Reads don't change state." }
        - { id: put, text: "`PUT /users/7/email` with the full new email", bucket: safe, why: "Setting a value twice leaves the same value." }
        - { id: delete, text: "`DELETE /cart/items/9`", bucket: safe, why: "Deleted twice is still deleted (the second may return 404)." }
        - { id: post-pay, text: "`POST /payments`", bucket: unsafe, why: "Each call creates a new charge." }
        - { id: increment, text: "`UPDATE wallet SET balance = balance + 100`", bucket: unsafe, why: "Each run adds again; record the transaction id and apply once." }
        - { id: email, text: "“Send the welcome email” consumer", bucket: unsafe, why: "Redelivery sends it twice; record sent message ids." }

  boss:
    name: The Echo Twins
    taunt: "Did we charge you? Let's charge you again, just to be sure."
    questions:
      - prompt: "Interviewer: “Exactly-once delivery: possible?”"
        choices:
          - text: "Not over an unreliable network. You get at-least-once delivery plus idempotent processing: exactly-once effects."
            correct: true
            why: "The precise, honest answer."
          - text: "Yes: TCP's sequence numbers and acknowledgements guarantee each message is delivered exactly once."
            why: "TCP works per connection; application retries span connections."
          - text: "Yes, if you use Kafka with exactly-once mode turned on for every producer and consumer."
            why: "Kafka's exactly-once covers Kafka-to-Kafka flows, not side effects like a charge."
      - prompt: "What's the outbox pattern for?"
        choices:
          - text: "Saving a state change and its event atomically: write both in one transaction, then publish from the outbox."
            correct: true
            why: "It avoids the dual-write problem."
          - text: "Queuing outgoing emails in a table so they're sent in batches and never lost."
            why: "It's for any event, not just email."
          - text: "Keeping a separate log table of every change, so you can restore the database to any earlier point in time after a bad deploy."
            why: "That's a write-ahead log or backup; the outbox is about publishing events reliably."
      - prompt: "Why add jitter to exponential backoff?"
        choices:
          - text: "So clients that failed together don't all retry at the same instant and create load spikes."
            correct: true
            why: "Randomness spreads the retries."
          - text: "To make each retry slightly faster than the last, so recovery is quicker."
            why: "It's about spreading retries out, not speed."
          - text: "So attackers can't predict retry timing and replay requests."
            why: "Replay protection comes from idempotency keys; jitter spreads load."

  recall:
    kind: cloze
    prompt: Safe retries from memory.
    text: "An operation is [[idempotent]] if repeating it has the same effect as doing it once. Clients send an [[idempotency key]] per intent, and the server stores it with a [[unique]] constraint. Networks give [[at-least-once]] delivery, so consumers deduplicate. The [[outbox]] pattern saves a change and its event atomically, and retries use exponential backoff with [[jitter]]."
    bank: [idempotent, idempotency key, unique, at-least-once, outbox, jitter, immutable, session id, at-most-once, inbox]

  codex:
    oneLiner: Make every retryable operation idempotent (keys, unique constraints, dedupe), because networks only offer at-least-once delivery.
    analogy: "A lift call button. Pressing it five times still calls one lift."
    keyPoints:
      - "Idempotency key per user intent; store key, request hash and response."
      - "Atomic guard: a unique constraint, not a cache check."
      - "At-least-once delivery plus dedupe gives exactly-once effects."
      - "Outbox pattern solves the dual-write problem."
      - "Retry only retryable errors, with backoff, jitter and a cap."
    whenToUse:
      - "Payments, orders, bookings, emails, any consumer of a queue."
    whenNotToUse:
      - Pure reads and full-value PUTs, which are already idempotent.
    interviewTells:
      - "“What if the request is retried?”, “double charge”, “exactly once”, “duplicate messages”."
    pitfalls:
      - Server-generated keys.
      - Check-then-act without atomicity.
      - Publishing events outside the transaction.

  cards:
    - prompt: "Two retries with the same idempotency key arrive at the same moment. What prevents a double charge?"
      choices:
        - text: "An atomic insert of the key under a unique constraint: one wins, the other gets the stored result."
          correct: true
          why: "The database enforces it."
        - text: "Checking Redis for the key first, and only charging the card if it's missing, then saving the key with a 24-hour TTL."
          why: "Both can miss the cache at the same moment."
        - text: "A short random delay before processing, so they don't overlap."
          why: "They still can; only an atomic guard is safe."
