id: hld-design-web-crawler
title: "Case File: Web Crawler"
summary: "Crawl 1 billion pages a month for a search engine, without crawling the same page twice, getting stuck in infinite calendars, or hammering any site. URL frontier, politeness, dedupe and distributed workers."
world: arena
order: 9
difficulty: 3
type: sequence-builder
concepts: [design-web-crawler]
prerequisites: [system-design-interview, message-queue, bloom-filter]
minutes: 13
primaryVisual: architecture
whenNotToUse: "To scrape a few known sites, a simple script with a queue and rate limit is plenty; a distributed crawler is for web-scale coverage."

rift:
  pain:
    scene: |
      **SearchSprout** builds its first crawler: a loop that pops a URL, downloads it, extracts links and pushes them back.

      Within a day it has downloaded the same news homepage 40,000 times, got stuck crawling `calendar?date=` pages into the year 3000, and a small college website blocked it for sending 200 requests a second.
    prompt: "Which three things is the crawler missing?"
    options:
      - text: "URL and content deduplication, protection against crawler traps, and per-host politeness (rate limits and robots.txt)."
        outcome: "Those three turn a loop into a crawler."
      - text: "More threads."
        outcome: "More threads would hammer sites faster."
      - text: "A faster internet connection."
        outcome: "Speed amplifies every problem here."
    lesson: "A crawler is a loop around a **URL frontier**: a prioritised, **per-host-queued** set of URLs to fetch. **Fetchers** respect **robots.txt** and per-host delays, a **DNS cache** saves lookups, **parsers** extract links, **URL dedupe** (a Bloom filter or hash set of normalised URLs) and **content dedupe** (checksums or SimHash) stop repeats, and **trap limits** (depth, URL length, per-site caps) avoid infinite spaces."

  play:
    - kind: estimate
      title: Size it
      intro: "1 month ≈ 2.5 million seconds. Within 2× counts."
      questions:
        - id: pages
          prompt: "1 billion pages a month. Pages per second?"
          givens: ["1B pages/month", "1 month ≈ 2.5M s"]
          answer: 400
          unit: pages/second
          working: "1,000,000,000 ÷ 2,500,000 = 400 pages a second on average."
        - id: storage
          prompt: "Average page 500 KB of HTML. Storage per month, in bytes?"
          givens: ["1B pages", "500 KB each"]
          answer: 500000000000000
          unit: bytes
          working: "1B × 500 KB = 500 TB a month; compress and keep only what the indexer needs."
    - kind: order
      title: One URL's journey
      intro: Put the crawl loop in order.
      items:
        - { id: frontier, text: "The **frontier** hands a URL to a fetcher, choosing from a host queue that is due (politeness delay elapsed)", why: "Prioritised and polite." }
        - { id: robots, text: "Fetcher checks cached **robots.txt** rules and resolves DNS from a **DNS cache**", why: "Respect site rules; DNS is a hidden bottleneck." }
        - { id: download, text: "Fetcher **downloads** the page with a timeout and size limit", why: "Defensive fetching." }
        - { id: content-dedupe, text: "**Content dedupe**: skip if the page's fingerprint was seen before", why: "Mirrors and duplicates are common." }
        - { id: store, text: "Store the page in **object storage** for the indexer", why: "Durable, cheap." }
        - { id: extract, text: "**Extract links**, normalise them, and drop ones already seen (**URL dedupe**)", why: "Bloom filter or URL-seen store." }
        - { id: enqueue, text: "Add new URLs to the frontier with a priority", why: "The loop continues." }
    - kind: steps
      title: Deep dives
      intro: The parts interviewers probe.
      steps:
        - prompt: "How does the frontier enforce politeness across 500 fetcher machines?"
          options:
            - text: "Partition the frontier by hostname, so each host's queue lives on one machine that enforces its delay."
              correct: true
              feedback: "One owner per host makes politeness easy to enforce."
            - text: "Give every fetcher a fixed one-second delay between its own requests, whichever hosts it happens to be crawling."
              feedback: "Each fetcher is polite alone, but 500 of them can still hit the same site 500 times a second."
        - prompt: "How do you avoid infinite crawler traps?"
          options:
            - text: "Cap depth and URL length, limit pages per host, spot repeating URL patterns, and fingerprint content."
              correct: true
              feedback: "Several cheap guards together."
            - text: "Follow every link but drop any URL whose response took more than five seconds, since traps are always slow."
              feedback: "Traps are usually fast: an endless calendar answers instantly, page after page."
        - prompt: "Which pages should be re-crawled most often?"
          options:
            - text: "Pages that change often and matter most, like news homepages, judged from past change rates and importance."
              correct: true
              feedback: "Freshness budgets go where they pay off."
            - text: "Every page on the same fixed schedule, say weekly, so the whole index stays evenly fresh."
              feedback: "Most pages rarely change; spend the budget where change happens."

  boss:
    name: The Infinite Calendar
    taunt: "Next month. And the next. And the next. I have pages until the heat death of the universe."
    questions:
      - prompt: "Interviewer: “How do you know whether you've seen a URL among billions?”"
        choices:
          - text: "Normalise the URL, then check a Bloom filter (a rare false positive just skips a page) or a sharded 'seen' store."
            correct: true
            why: "Probabilistic or exact, with the trade-off stated."
          - text: "Search the stored pages for that URL in the page database, which is already indexed by URL."
            why: "Far too slow at thousands of lookups a second across billions of rows."
          - text: "Keep every seen URL in an in-memory list on each fetcher."
            why: "O(n) lookups over billions, and fetchers can't see each other's lists."
      - prompt: "Two URLs serve the same article (with and without tracking parameters). How do you catch it?"
        choices:
          - text: "Normalise URLs (strip tracking parameters, lowercase the host) plus content fingerprints like SimHash."
            correct: true
            why: "Both layers."
          - text: "Compare the two pages' titles: matching titles mean the same article."
            why: "Many pages share titles; normalise URLs and fingerprint content."
          - text: "Store both copies and let the search indexer collapse the duplicates later when it builds the index."
            why: "Wastes crawl budget."
      - prompt: "Why is DNS a bottleneck in crawlers?"
        choices:
          - text: "Each new host needs a lookup costing tens to hundreds of milliseconds; at this rate you need a DNS cache."
            correct: true
            why: "A classic gotcha."
          - text: "DNS servers rate-limit and block clients that resolve thousands of hostnames a minute."
            why: "Some do throttle, but the core cost is the latency of each lookup."
          - text: "It isn't: lookups are cached by the operating system, so each host costs one lookup ever."
            why: "OS caches are small and short-lived; a crawler meets millions of new hosts."

  recall:
    kind: blueprint
    prompt: Draw the crawler's main loop.
    palette: [Seed URLs, URL frontier, Fetcher, DNS cache, Page store, Link extractor, URL seen filter, Content dedupe, Payment service, Chat server]
    relations: [feeds, dispatches, resolves, stores, extracts, checks, enqueues]
    kinds: { Seed URLs: storage, URL frontier: queue, Fetcher: worker, DNS cache: cache, Page store: storage, Link extractor: worker, URL seen filter: cache, Content dedupe: service, Payment service: service, Chat server: service }
    reference:
      nodes: [Seed URLs, URL frontier, Fetcher, Page store, Link extractor, URL seen filter]
      edges:
        - { from: Seed URLs, to: URL frontier, type: feeds }
        - { from: URL frontier, to: Fetcher, type: dispatches }
        - { from: Fetcher, to: Page store, type: stores }
        - { from: Fetcher, to: Link extractor, type: extracts }
        - { from: Link extractor, to: URL seen filter, type: checks }
        - { from: Link extractor, to: URL frontier, type: enqueues }
    acceptedExtras:
      nodes: [DNS cache, Content dedupe]
      edges:
        - { from: Fetcher, to: DNS cache, type: resolves }
        - { from: Fetcher, to: Content dedupe, type: checks }

  codex:
    oneLiner: "A prioritised, host-partitioned URL frontier feeding polite fetchers, with URL and content dedupe and trap limits."
    analogy: "Library volunteers cataloguing every book in a city: a master to-do list split by neighbourhood, one volunteer per bookshop so no shop gets swamped, and a checklist so nobody catalogues the same book twice."
    keyPoints:
      - "Frontier: priority plus per-host queues; partition by host."
      - "Politeness: robots.txt, per-host delays, user agent."
      - "DNS cache, timeouts, size limits."
      - "URL normalisation plus Bloom filter; content fingerprints (SimHash)."
      - "Trap guards: depth, length, per-host caps."
      - "Recrawl by change rate and importance."
    whenToUse:
      - "“Design a web crawler / search engine indexer / price-monitoring scraper”."
    whenNotToUse:
      - "Small scraping jobs."
    interviewTells:
      - "“Crawl the web”, “billions of pages”, “politeness”, “duplicates”."
    pitfalls:
      - Global FIFO without per-host queues.
      - No trap limits.
      - Ignoring robots.txt.

  cards:
    - prompt: "Why partition the URL frontier by hostname?"
      choices:
        - text: "One owner per host can enforce that host's crawl delay, even with hundreds of fetchers."
          correct: true
          why: "Politeness by ownership."
        - text: "Hostnames sort well, so the frontier can be scanned alphabetically and resumed after a crash."
          why: "Sorting isn't the point; politeness per host is."
        - text: "Pages on the same host link to each other, so ranking is cheaper per partition."
          why: "Ranking happens later in the indexer; this is about crawl politeness."
