id: lld-uml-class-diagram
title: Reading the Blueprint
summary: "An interviewer slides a class diagram across the table: plus signs, hashes, underlines, italics and little numbers on the lines. Learn to read and write UML class notation fluently."
world: objects
order: 7
difficulty: 1
type: pattern-match
concepts: [uml-class-diagram]
prerequisites: [classes-objects]
minutes: 8
whenNotToUse: "Don't draw every getter and private field in an interview. Show the classes, key operations and relationships that explain the design."

rift:
  pain:
    scene: |
      In an LLD round, the interviewer sketches a class box and asks Arjun to implement it. He writes every member as `public`, makes `count` a normal field and gives `Shape` a constructor.

      Each was wrong, and each was written right there on the diagram: `-`, an underline and *italics*.
    code:
      language: text
      source: |
        ┌──────────────────────────┐
        │   «abstract» Shape       │   ← italic name: abstract
        ├──────────────────────────┤
        │ - id: String             │   - private
        │ # colour: Colour         │   # protected
        │ count: int  (underlined) │   underline: static
        ├──────────────────────────┤
        │ + area(): double  (ital.)│   italic op: abstract
        │ + describe(): String     │   + public
        │ ~ validate(): void       │   ~ package
        └──────────────────────────┘
    prompt: "What was Arjun missing?"
    options:
      - text: "UML notation: visibility symbols, static (underline), abstract (italics or «abstract») and types after colons."
        outcome: "A class box is a compact spec. Every symbol is an instruction."
      - text: "Better handwriting."
        outcome: "The diagram was clear; reading it was the problem."
      - text: "Nothing; diagrams are just decoration."
        outcome: "In LLD rounds, the diagram is the contract you then code."
    lesson: "A **class box** has three compartments: name, **attributes** (`name: Type`) and **operations** (`name(params): ReturnType`). **Visibility**: `+` public, `-` private, `#` protected, `~` package. **Underlined** means static; *italic* or «abstract» means abstract; «interface» marks interfaces. **Multiplicity** on lines (`1`, `0..1`, `*`, `1..*`) says how many."

  play:
    - kind: sort
      title: Decode the symbols
      intro: What does each piece of notation mean?
      buckets:
        - { id: public, label: "Public (+)" }
        - { id: private, label: "Private (-)" }
        - { id: protected, label: "Protected (#)" }
        - { id: modifier, label: "Static or abstract" }
      items:
        - { id: plus-pay, text: "`+ pay(amount: long): Receipt`", bucket: public, why: "`+` is public: part of the class's API." }
        - { id: minus-balance, text: "`- balance: long`", bucket: private, why: "`-` is private: hidden state." }
        - { id: hash-colour, text: "`# colour: Colour`", bucket: protected, why: "`#` is protected: visible to subclasses." }
        - { id: underline, text: "An underlined `instance: Config`", bucket: modifier, why: "Underline means static: one per class (a Singleton field, for example)." }
        - { id: italic, text: "An italic `area(): double`", bucket: modifier, why: "Italics mean abstract: subclasses must implement it." }
        - { id: plus-getid, text: "`+ getId(): String`", bucket: public, why: "Public operation." }
        - { id: minus-helper, text: "`- recalculate(): void`", bucket: private, why: "A private helper." }
    - kind: sort
      title: Read the multiplicities
      intro: "Each line end has a number. Match each one to its meaning."
      buckets:
        - { id: exactly-one, label: "1 (exactly one)" }
        - { id: zero-one, label: "0..1 (optional)" }
        - { id: many, label: "* or 0..* (any number)" }
        - { id: one-many, label: "1..* (at least one)" }
      items:
        - { id: order-customer, text: "Every Order belongs to its Customer", bucket: exactly-one, why: "An order without a customer is invalid." }
        - { id: user-photo, text: "A User may have a profile photo", bucket: zero-one, why: "Optional: zero or one." }
        - { id: customer-orders, text: "A Customer's Orders (a new customer has none)", bucket: many, why: "Zero or more." }
        - { id: order-lines, text: "An Order's OrderLines (an empty order is invalid)", bucket: one-many, why: "At least one line." }
        - { id: seat-booking, text: "A Seat's current Booking for a show", bucket: zero-one, why: "Booked or not." }
        - { id: team-members, text: "A Team's members (a team needs someone)", bucket: one-many, why: "At least one member." }
    - kind: steps
      title: Code from the box
      intro: Turn notation into code.
      start:
        code:
          language: text
          source: |
            «interface» PaymentMethod
              + pay(amount: long): Receipt

            UpiPayment  ┄┄▷  PaymentMethod
              - vpa: String
              + pay(amount: long): Receipt
      steps:
        - prompt: "A dashed line with a hollow triangle from `UpiPayment` to `PaymentMethod` means…"
          options:
            - text: "`UpiPayment implements PaymentMethod` (realisation)."
              correct: true
              feedback: "Dashed + hollow triangle = implements. Solid + hollow triangle = extends."
            - text: "`UpiPayment` uses a `PaymentMethod` briefly, as a parameter."
              feedback: "That would be a dashed open arrow (dependency)."
            - text: "`class UpiPayment extends PaymentMethod` (generalisation)."
              feedback: "Generalisation is a solid line with a hollow triangle; the dashed line means implements."
          after:
            code:
              language: java
              source: |
                interface PaymentMethod { Receipt pay(long amount); }

                class UpiPayment implements PaymentMethod {
                    private String vpa;
                    @Override public Receipt pay(long amount) { /* ... */ }
                }
        - prompt: "`Order ◆── 1..* OrderLine`. How do you code the filled diamond and the multiplicity?"
          options:
            - text: "`Order` creates and owns a `List<OrderLine>`, never shares it, and rejects an empty list."
              correct: true
              feedback: "Filled diamond = composition (lifetime owned). 1..* = validate at least one."
            - text: "`OrderLine` holds a reference to its `Order`, and each order can have at most one line at a time."
              feedback: "The diamond sits at Order, the owner, and 1..* means one or more lines."

  boss:
    name: The Notation Ninja
    taunt: "+, -, #, ~. Underlines. Italics. Diamonds. Which one did you forget?"
    questions:
      - prompt: "Interviewer: “What does `- items: List<Item> [0..*]` mean?”"
        choices:
          - text: "A private attribute `items` of type `List<Item>`, holding zero or more items."
            correct: true
            why: "Visibility, name, type, multiplicity."
          - text: "A public method `items()` that removes and returns every item in the list at once."
            why: "`-` means private, and there are no parentheses."
          - text: "A protected list that must hold at least one item."
            why: "`-` means private, and `0..*` allows zero."
      - prompt: "How does UML show an interface?"
        choices:
          - text: "A class box with «interface» above the name; implementations point to it with dashed hollow-triangle lines."
            correct: true
            why: "Both notations are common."
          - text: "A box with a thick border and italic method names, with solid arrows coming from each class that implements it."
            why: "Italics mark abstract members and solid triangles mean extends; interfaces get «interface» and dashed lines."
          - text: "A box whose name is underlined, with filled diamonds from each implementation."
            why: "Underline means static, and filled diamonds mean composition."
      - prompt: "In an interview, how much detail should your class diagram show?"
        choices:
          - text: "Key classes, their main operations and attributes, and correctly typed relationships with multiplicities."
            correct: true
            why: "Enough to explain and defend the design."
          - text: "Every field, getter and setter, so the interviewer can see the complete design at a glance."
            why: "That wastes your limited time."
          - text: "Only class names and their arrows, with no attributes or operations."
            why: "The main operations matter too; just skip trivial getters."

  recall:
    kind: cloze
    prompt: UML class notation from memory.
    text: "In a class box, `+` means [[public]], `-` means [[private]] and `#` means [[protected]]. An [[underlined]] member is static, and an [[italic]] name is abstract. On a line, [[1..*]] means at least one."
    bank: [public, private, protected, underlined, italic, "1..*", bold, "0..1", package, final]

  codex:
    oneLiner: "A UML class box lists name, attributes and operations with visibility (+ - # ~), types, static (underline), abstract (italics) and multiplicities."
    analogy: "An architect's floor plan. A few standard symbols (doors, windows, stairs) let any builder read it the same way."
    keyPoints:
      - "Three compartments: name, attributes (`name: Type`), operations (`op(p: T): R`)."
      - "Visibility: + public, - private, # protected, ~ package."
      - "Underline = static; italics or «abstract» = abstract; «interface» = interface."
      - "Multiplicity: 1, 0..1, *, 1..*, n..m."
      - "Lines: see the Diagram Dojo for the six relationship types."
    whenToUse:
      - LLD and machine-coding rounds, design documents, onboarding.
    whenNotToUse:
      - "Trivial code; or as a complete mirror of the code (it rots)."
    interviewTells:
      - "“Draw the class diagram”, “what are the relationships?”."
    pitfalls:
      - Mixing up the dashed and solid triangles.
      - Forgetting multiplicities.
      - Drawing every getter.

  cards:
    - prompt: "What does `# draw(): void` mean in a class box?"
      choices:
        - text: "A protected operation `draw` that returns nothing."
          correct: true
          why: "# = protected."
        - text: "A static operation `draw`, shared by all."
          why: Static is shown by underlining.
        - text: "A package-private operation `draw`."
          why: "Package-private is `~`; `#` is protected."
