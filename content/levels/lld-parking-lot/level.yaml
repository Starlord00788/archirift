id: lld-parking-lot
title: Design a Parking Lot
summary: "The most famous machine-coding question. Model floors, spots, vehicles, tickets and pricing so that EV spots and weekend rates arrive without rewrites."
world: agency
order: 3
difficulty: 2
type: blueprint-puzzle
concepts: [parking-lot]
prerequisites: [strategy, srp]
minutes: 12
whenNotToUse: "In an interview, don't over-build: get the core entities and one flow working before adding payments, displays and admin panels."

rift:
  pain:
    scene: |
      Machine-coding round, 90 minutes: **“Design a parking lot for a mall: multiple floors, bikes, cars and trucks, tickets at entry, payment at exit.”**

      Karan writes one `ParkingLot` class with a `String[][] spots` grid, an `int` for vehicle type, and a 200-line `exit()` method that computes fees with nested ifs. Forty minutes in, the interviewer says: *“Now add EV charging spots and a weekend tariff.”*
    prompt: "What's Karan's biggest problem now?"
    options:
      - text: "Everything lives in one class with type codes, so every new requirement edits the same tangled code."
        outcome: "No entities, no seams. The interviewer is testing exactly this: extensibility."
      - text: "He should have used a database."
        outcome: "Machine coding rounds are about in-memory object design."
      - text: "He typed too slowly."
        outcome: "Speed matters, but the design is what's being evaluated."
    lesson: "Start with **requirements**, then **core entities** (ParkingLot, Floor, Spot, Vehicle, Ticket), then **behaviours** and where they vary. Spot assignment and pricing vary, so make them **strategies**. Vehicle and spot types are types, not `int` codes."

  play:
    - kind: sort
      title: Clarify the requirements
      intro: The first five minutes of the round. Which requirements are in scope for a 90-minute build?
      buckets:
        - { id: core, label: Core (build it) }
        - { id: later, label: Mention, but don't build }
      items:
        - { id: park, text: Park and unpark vehicles of different sizes, bucket: core, why: "The central flow." }
        - { id: ticket, text: Issue a ticket at entry and compute the fee at exit, bucket: core, why: "Needed for the end-to-end flow." }
        - { id: availability, text: Show free spots per floor and type, bucket: core, why: "Cheap to add and commonly asked." }
        - { id: pricing, text: Pluggable pricing (hourly, weekend), bucket: core, why: "The extensibility the interviewer will probe." }
        - { id: ui, text: A mobile app UI, bucket: later, why: "Out of scope for LLD." }
        - { id: payments, text: Integrate real UPI and card gateways, bucket: later, why: "Model a Payment interface; don't integrate." }
        - { id: cameras, text: Number-plate recognition cameras, bucket: later, why: "An external system; mention an interface at most." }
    - kind: steps
      title: Shape the core model
      intro: Make the key design decisions.
      steps:
        - prompt: "How do you model vehicle types (bike, car, truck)?"
          options:
            - text: "An enum `VehicleSize` on `Vehicle`, and each `Spot` has a size it accepts."
              correct: true
              feedback: "Type-safe and simple. A full Vehicle class hierarchy adds little unless behaviour differs per type."
            - text: "An `int vehicleType` where 1 is bike and 2 is car."
              feedback: "Magic numbers invite bugs; the compiler can't help you."
            - text: "A subclass per vehicle, with `instanceof` checks when choosing a spot."
              feedback: "instanceof checks spread across the lot; a size on each vehicle and spot is simpler."
        - prompt: "Spot assignment rules vary: nearest to the entrance, lowest floor first, EV-first for electric cars. How?"
          options:
            - text: "A `SpotAssignmentStrategy` interface the lot asks for a spot."
              correct: true
              feedback: "New rules are new classes, injected without touching ParkingLot."
            - text: "An if/else inside `park()` that checks a `mode` setting on the lot."
              feedback: "That's the tangle Karan built."
        - prompt: "Fees: hourly for cars, flat for bikes, double on weekends. How?"
          options:
            - text: "A `PricingStrategy` interface, with weekend pricing as a decorator or another strategy."
              correct: true
              feedback: "The Hydra lesson again: rules that change often belong behind an interface."
            - text: "A switch on vehicle type inside `Ticket.fee()`, with a weekend flag multiplying the result."
              feedback: "Tickets would then know every tariff."
          after:
            diagram:
              nodes:
                - { id: ParkingLot, lines: ["+ park(vehicle)", "+ unpark(ticket)"] }
                - { id: Floor }
                - { id: Spot, lines: ["size, occupied"] }
                - { id: Ticket, lines: ["vehicle, spot, entryTime"] }
                - { id: SpotAssignmentStrategy, kind: interface }
                - { id: PricingStrategy, kind: interface }
              edges:
                - { from: ParkingLot, to: Floor, type: composes }
                - { from: Floor, to: Spot, type: composes }
                - { from: ParkingLot, to: SpotAssignmentStrategy, type: uses }
                - { from: ParkingLot, to: PricingStrategy, type: uses }
                - { from: ParkingLot, to: Ticket, type: creates }
            note: "Entities own data; strategies own the rules that change."
        - prompt: "Two cars arrive at two gates at the same moment, and there's one spot left. What protects you?"
          options:
            - text: "Make allocation atomic: lock the floor, or compare-and-set the spot's occupied flag."
              correct: true
              feedback: "Interviewers love this follow-up. Same race as the double-booked seat."
            - text: "Each gate checks that the spot is free, then marks it occupied straight away."
              feedback: "Check-then-act: both gates can see it free before either marks it."
        - prompt: "EV spots with chargers arrive. What changes?"
          options:
            - text: "Add an EV spot type, an EV-aware assignment strategy, and a charging fee; core classes stay the same."
              correct: true
              feedback: "That's the extensibility the interviewer wanted to see."
            - text: "Add an `isEV` flag to every Spot and a branch for it in `ParkingLot.park()` and `exit()`."
              feedback: "Branches in the core class are what strategies avoid; plug in an EV-aware strategy."

  boss:
    name: The Machine-Coding Proctor
    taunt: "You have 90 minutes, and I'll change the requirements at minute 40. Ready?"
    questions:
      - prompt: "Interviewer: “What are the core entities?”"
        choices:
          - text: "ParkingLot, Floor, Spot, Vehicle and Ticket, plus strategies for assignment and pricing."
            correct: true
            why: "A clean, recognisable model."
          - text: "ParkingLot, a `Spot[]` array per floor, and a `Map<String, Long>` of number plates to entry times."
            why: "No room to extend."
          - text: "Car, Bike and Truck classes, plus a Gate."
            why: "Missing the Spot, Floor and Ticket the design revolves around."
      - prompt: "How would you find a free spot quickly in a 10,000-spot lot?"
        choices:
          - text: "Keep sets of free spots per floor and size (or a heap by distance), updated on park and exit."
            correct: true
            why: "O(1) or O(log n) instead of scanning every spot."
          - text: "Scan all the spots from the first floor up each time a car arrives, stopping at the first free one."
            why: "O(n) per car is fine for 50 spots, not for 10,000."
          - text: "Pick a random spot and retry if it's taken."
            why: "Not reliable."
      - prompt: "Which design pattern fits the pricing rules?"
        choices:
          - text: "Strategy, with decorators for surcharges like weekends."
            correct: true
            why: "Interchangeable rules behind one interface."
          - text: "Singleton, so that every gate always uses the same tariff."
            why: "One lot instance may be a singleton, but pricing variation is Strategy."
          - text: "Observer, notified on every exit."
            why: "Observer suits display boards updating when spots change, not pricing."

  recall:
    kind: blueprint
    prompt: Sketch the parking lot's core model from memory.
    palette: [ParkingLot, Floor, Spot, Ticket, PricingStrategy, SpotAssignmentStrategy, Vehicle, ParkingLotUtils, SpotManagerImpl, Gate]
    relations: [composes, uses, creates, has, implements]
    kinds: { PricingStrategy: interface, SpotAssignmentStrategy: interface }
    reference:
      nodes: [ParkingLot, Floor, Spot, Ticket, PricingStrategy, SpotAssignmentStrategy]
      edges:
        - { from: ParkingLot, to: Floor, type: composes }
        - { from: Floor, to: Spot, type: composes }
        - { from: ParkingLot, to: Ticket, type: creates }
        - { from: ParkingLot, to: PricingStrategy, type: uses }
        - { from: ParkingLot, to: SpotAssignmentStrategy, type: uses }
    acceptedExtras:
      nodes: [Vehicle, Gate]
      edges:
        - { from: Ticket, to: Vehicle, type: has }
        - { from: Ticket, to: Spot, type: has }
        - { from: ParkingLot, to: Gate, type: composes }

  codex:
    oneLiner: Entities for the lot, floors, spots, vehicles and tickets; strategies for the rules that change (assignment, pricing); atomic allocation for concurrency.
    analogy: "A real mall car park: levels, marked bays for bikes and cars, a ticket at the boom barrier, a tariff board at the exit, and an attendant pointing you to a free bay."
    keyPoints:
      - "Clarify requirements and scope first (about 5 minutes)."
      - "Entities: ParkingLot → Floor → Spot; Vehicle; Ticket."
      - "Enums for sizes and types; no magic numbers."
      - Strategies for spot assignment and pricing.
      - Index free spots per floor and size for fast lookup.
      - "Concurrency: atomic spot allocation."
    whenToUse:
      - "LLD and machine-coding rounds; a template for resource-allocation problems (hotel rooms, lockers, seats)."
    whenNotToUse:
      - Don't build payments, UI or hardware integrations in the round.
    interviewTells:
      - "“Design a parking lot”, “add EV spots”, “weekend pricing”, “multiple entry gates”."
    pitfalls:
      - God-class ParkingLot.
      - Ignoring concurrency at gates.
      - Scanning every spot to find a free one.

  cards:
    - prompt: "Interviewer adds weekend surcharges to an hourly tariff. The cleanest change?"
      choices:
        - text: "Wrap the existing PricingStrategy in a WeekendSurcharge decorator, without editing ParkingLot."
          correct: true
          why: "Open for extension, closed for modification."
        - text: "Add an if-weekend check in `ParkingLot.exit()` that doubles whatever the strategy returns."
          why: That's the tangle.
        - text: "Subclass each pricing strategy with a weekend version."
          why: "A subclass per strategy doubles the classes; one decorator wraps any of them."
