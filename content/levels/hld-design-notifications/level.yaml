id: hld-design-notifications
title: "Case File: Notification Service"
summary: "One service sends every push, SMS and email for a food-delivery app: order updates that must arrive in seconds, and marketing blasts to 30 million users that must not drown them. Priorities, preferences, retries and dedupe."
world: arena
order: 5
difficulty: 3
type: sequence-builder
concepts: [design-notifications]
prerequisites: [system-design-interview, message-queue, idempotency, rate-limiting]
minutes: 12
primaryVisual: architecture
whenNotToUse: "A small app can call an email or push provider directly from its backend. A central notification service pays off when many teams and channels share it."

rift:
  pain:
    scene: |
      **FoodDash** sends notifications from six services, each calling SMS, email and push providers directly.

      On Diwali evening marketing blasts **30 million** promo pushes. The shared push provider throttles FoodDash, and *“Your order is arriving”* messages show up 40 minutes late. Some users get the same promo four times; others who unsubscribed get it anyway.
    prompt: "What would a good design have done differently?"
    options:
      - text: "One notification service with separate priority queues (transactional ahead of marketing), user preferences and dedupe checks, and per-provider rate limits."
        outcome: "Critical messages never wait behind a promo blast."
      - text: "Send marketing at 3 am."
        outcome: "Users love 3 am notifications. Not."
      - text: "Use a second push provider."
        outcome: "Still no priorities, dedupe or preference checks."
    lesson: "A **notification service** accepts requests from every team, checks **preferences and opt-outs**, applies **templates**, **dedupes** with idempotency keys, and routes to **per-channel queues with priorities**. Channel **workers** call providers (APNs, FCM, SMS gateways, email) with **rate limits**, **retries** with backoff and **fallbacks**, and record delivery status."

  play:
    - kind: order
      title: Follow one notification
      intro: "“Your order is on the way” travels through the system. Put the steps in order."
      items:
        - { id: request, text: "Order service calls `POST /notify` with user, template id, data and an **idempotency key**", why: "One entry point for every team." }
        - { id: dedupe, text: "Notification service **dedupes** by key and checks the user's **preferences** and quiet hours", why: "Never send twice; respect opt-outs." }
        - { id: render, text: "It renders the **template** in the user's language", why: "Content is separated from code." }
        - { id: enqueue, text: "It enqueues on the **high-priority push queue**", why: "Transactional ahead of marketing." }
        - { id: worker, text: "A push **worker** sends through FCM/APNs within the provider's rate limit", why: "Workers isolate provider quirks." }
        - { id: status, text: "Delivery status is recorded; on failure it **retries**, then falls back to SMS", why: "Track and recover." }
    - kind: sort
      title: Priority lanes
      intro: Which queue should each notification use?
      buckets:
        - { id: critical, label: Critical (seconds) }
        - { id: normal, label: Normal (minutes) }
        - { id: bulk, label: Bulk (hours, throttled) }
      items:
        - { id: otp, text: "Login OTP code", bucket: critical, why: "Useless if late." }
        - { id: arriving, text: "“Your rider is arriving”", bucket: critical, why: "Time-sensitive transactional." }
        - { id: receipt, text: "Order receipt email", bucket: normal, why: "Important, not urgent." }
        - { id: review, text: "“Rate your meal” prompt", bucket: normal, why: "Can wait." }
        - { id: promo, text: "Diwali 30%-off campaign to 30M users", bucket: bulk, why: "Throttle and spread out." }
        - { id: digest, text: "Weekly newsletter", bucket: bulk, why: "Low urgency." }
    - kind: steps
      title: Deep dives
      intro: Make it reliable at scale.
      steps:
        - prompt: "How do you send 30 million promo pushes without being throttled or overwhelming users?"
          options:
            - text: "Split the audience into batches, send them over hours through the bulk queue with a rate limit and per-user caps."
              correct: true
              feedback: "Pace sends to providers' limits and users' patience."
            - text: "Send them all at once from extra worker machines, so the campaign finishes before people lose interest."
              feedback: "That's what got you throttled: providers rate-limit bursts."
        - prompt: "A push worker crashes after sending but before recording success. On retry, what prevents a duplicate?"
          options:
            - text: "Dedupe by notification id before sending, and use collapse keys; rare duplicates can still slip through."
              correct: true
              feedback: "Honest about the limits of exactly-once with external providers."
            - text: "Wrap the send and the success record in one database transaction, so a crash rolls both back and nothing is sent twice."
              feedback: "The push provider isn't part of your transaction. Dedupe by id and use collapse keys."
        - prompt: "How do teams add a new notification without deploying the notification service?"
          options:
            - text: "Templates and routing rules live as versioned data, edited through an admin tool."
              correct: true
              feedback: "Open for extension, closed for modification, at the system level."
            - text: "Each team adds its own message class to the service, reviewed and merged by the notifications team."
              feedback: "Every copy change becomes a code change and a deploy."

  boss:
    name: The Spam Specter
    taunt: "Four copies of every promo, at 3 am, to people who unsubscribed. Delightful."
    questions:
      - prompt: "Interviewer: “How do you guarantee an OTP isn't stuck behind a marketing blast?”"
        choices:
          - text: "Separate queues and worker pools per priority, so bulk traffic can't eat the capacity critical messages need."
            correct: true
            why: "Bulkheads for message classes."
          - text: "Send the OTP twice, a few seconds apart, so at least one copy gets past the marketing backlog."
            why: "Both copies sit behind the same backlog."
          - text: "Give the shared queue more workers during campaigns so the backlog clears faster."
            why: "Bigger shared capacity still doesn't isolate them; the next blast fills it again."
      - prompt: "Where are user preferences checked?"
        choices:
          - text: "Centrally, in the notification service before enqueueing, so every team gets opt-outs and quiet hours free."
            correct: true
            why: "One place to get compliance right."
          - text: "In each calling service, since every team knows best which of its own messages a user wants."
            why: "Six teams, six chances to get it wrong."
          - text: "On the phone: the OS hides notifications from apps the user has muted."
            why: "Email and SMS have no OS mute, and opt-out rules are a legal duty."
      - prompt: "A push provider is down. What should happen to critical messages?"
        choices:
          - text: "A breaker trips for that provider; messages retry with backoff, and critical ones fall back to SMS."
            correct: true
            why: "Resilience patterns applied."
          - text: "Drop them and log the failure, since the provider will be back soon."
            why: "Critical messages can't be dropped."
          - text: "Retry each one immediately, over and over again, until the provider comes back and finally accepts it."
            why: "That's a retry storm against a provider that's already down."

  recall:
    kind: blueprint
    prompt: Draw the notification service.
    palette: [Order service, Notification API, Preferences DB, Template store, Priority queue, Push worker, SMS worker, FCM / APNs, SMS gateway, Graph DB, Video encoder]
    relations: [calls, checks, renders, enqueues, consumes, sends]
    kinds: { Order service: service, Notification API: service, Preferences DB: database, Template store: database, Priority queue: queue, Push worker: worker, SMS worker: worker, FCM / APNs: service, SMS gateway: service, Graph DB: database, Video encoder: worker }
    reference:
      nodes: [Order service, Notification API, Preferences DB, Priority queue, Push worker, FCM / APNs]
      edges:
        - { from: Order service, to: Notification API, type: calls }
        - { from: Notification API, to: Preferences DB, type: checks }
        - { from: Notification API, to: Priority queue, type: enqueues }
        - { from: Push worker, to: Priority queue, type: consumes }
        - { from: Push worker, to: FCM / APNs, type: sends }
    acceptedExtras:
      nodes: [Template store, SMS worker, SMS gateway]
      edges:
        - { from: Notification API, to: Template store, type: renders }
        - { from: SMS worker, to: Priority queue, type: consumes }
        - { from: SMS worker, to: SMS gateway, type: sends }

  codex:
    oneLiner: "One service for every channel: preferences, templates, dedupe, priority queues, rate-limited workers, retries and fallbacks."
    analogy: "A city post office with an express counter. Telegrams (OTPs) skip the line, bulk flyers go out overnight, and the clerk checks the 'no junk mail' sticker before delivering."
    keyPoints:
      - "Single API with idempotency keys."
      - "Preferences, opt-outs, quiet hours, frequency caps."
      - "Templates as versioned data; localisation."
      - "Priority and channel queues; separate worker pools."
      - "Provider rate limits, retries with backoff, breakers, fallbacks."
      - "Delivery tracking and analytics."
    whenToUse:
      - "“Design a notification system”; any multi-channel messaging platform."
    whenNotToUse:
      - "A single app with one channel and low volume."
    interviewTells:
      - "“Push, SMS and email”, “millions of notifications”, “OTP delivery”."
    pitfalls:
      - One shared queue.
      - Preferences checked per team.
      - Unthrottled blasts.

  cards:
    - prompt: "Why separate worker pools per priority?"
      choices:
        - text: "So bulk sends can't use up the capacity that critical messages need."
          correct: true
          why: "Isolation (bulkheads)."
        - text: "To spread work across more servers and send faster overall."
          why: "The goal is isolation, not size."
        - text: "Push providers require one connection per priority."
          why: "They don't; it's your design choice for isolation."
