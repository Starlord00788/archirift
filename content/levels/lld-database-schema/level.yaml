id: lld-database-schema
title: The Spreadsheet Schema
summary: "A hostel app keeps everything in one table with columns room1, room2, room3… Turn classes into a clean relational schema: keys, normalisation, one-to-many and many-to-many, constraints and when to denormalise."
world: agency
order: 2
difficulty: 2
type: refactor-rush
concepts: [database-schema-design]
prerequisites: [lld-interview, database-indexing]
minutes: 10
whenNotToUse: "Don't normalise analytics tables or read-heavy caches to the extreme; deliberate denormalisation is fine where reads dominate and you control the updates."

rift:
  pain:
    scene: |
      **HostelHub** stores bookings in one sheet-like table. When a student changes their phone number, it must be updated in 14 rows, and someone always misses one. Adding a 4th room per booking needs a new column.
    code:
      language: sql
      highlight: [2, 3]
      source: |
        CREATE TABLE bookings (
          student_name TEXT, student_phone TEXT, student_email TEXT,
          room1 TEXT, room2 TEXT, room3 TEXT,
          hostel_name TEXT, hostel_address TEXT,
          check_in DATE, check_out DATE
        );
    prompt: "What's wrong with this table?"
    options:
      - text: "Facts are duplicated (student and hostel details repeat in every row) and repeating groups (room1..room3) are baked into columns."
        outcome: "Update anomalies and rigid structure: classic signs of an unnormalised schema."
      - text: "TEXT is the wrong type."
        outcome: "Types matter, but the structure is the bigger problem."
      - text: "It needs more columns."
        outcome: "That's the disease, not the cure."
    lesson: "Map **entities to tables** with a **primary key** each; link them with **foreign keys**. **One-to-many**: the 'many' side holds the foreign key. **Many-to-many**: a **join table**. **Normalise** so each fact lives in one place (no repeating groups, no columns depending on part of a key or on other non-key columns). Add **constraints** (NOT NULL, UNIQUE, CHECK) and **indexes** for your queries; denormalise deliberately for read speed."

  play:
    - kind: steps
      title: Normalise HostelHub
      intro: Split the sheet into a proper schema.
      steps:
        - prompt: "First, where do student details go?"
          options:
            - text: "A `students` table with a primary key; bookings reference `student_id`."
              correct: true
              feedback: "Change a phone number once, in one row."
            - text: "Keep them in bookings, but add an index on the student's email column."
              feedback: "Indexes speed up reads; they don't remove duplication."
        - prompt: "A booking can include several rooms, and a room appears in many bookings over time. How do you model that?"
          options:
            - text: "A join table `booking_rooms(booking_id, room_id)` with a composite primary key."
              correct: true
              feedback: "No more room1..room3 columns; any number of rooms."
            - text: "A comma-separated `room_ids` column on bookings, split in the code when needed."
              feedback: "Impossible to index, join or constrain."
        - prompt: "How do you stop the same room being double-booked for overlapping dates?"
          options:
            - text: "In the database: an exclusion constraint on (room, dates) in Postgres, or a transaction that locks and checks."
              correct: true
              feedback: "Invariants the database can enforce should be enforced there."
            - text: "Check for overlapping bookings in the booking service before inserting, and show an error if one exists."
              feedback: "Two requests at once can both pass the check before either inserts."
          after:
            code:
              language: sql
              source: |
                CREATE TABLE students (
                  id BIGSERIAL PRIMARY KEY,
                  name TEXT NOT NULL,
                  phone TEXT NOT NULL,
                  email TEXT NOT NULL UNIQUE
                );
                CREATE TABLE hostels (id BIGSERIAL PRIMARY KEY, name TEXT NOT NULL, address TEXT NOT NULL);
                CREATE TABLE rooms (
                  id BIGSERIAL PRIMARY KEY,
                  hostel_id BIGINT NOT NULL REFERENCES hostels(id),   -- one hostel, many rooms
                  number TEXT NOT NULL,
                  UNIQUE (hostel_id, number)
                );
                CREATE TABLE bookings (
                  id BIGSERIAL PRIMARY KEY,
                  student_id BIGINT NOT NULL REFERENCES students(id),
                  check_in DATE NOT NULL, check_out DATE NOT NULL,
                  CHECK (check_out > check_in)
                );
                CREATE TABLE booking_rooms (                           -- many-to-many
                  booking_id BIGINT REFERENCES bookings(id),
                  room_id BIGINT REFERENCES rooms(id),
                  PRIMARY KEY (booking_id, room_id)
                );
        - prompt: "The dashboard shows each hostel's occupancy, computed with heavy joins on every page view. Option?"
          options:
            - text: "Denormalise on purpose: an `occupied_count` on hostels updated in the same transaction, as reads dominate."
              correct: true
              feedback: "Normalise by default; denormalise with a reason and a way to keep it correct."
            - text: "Never denormalise: add indexes on every join column instead, and the dashboard query will be fast enough."
              feedback: "Indexes help, but recomputing heavy joins on every view is waste when reads vastly outnumber changes."
    - kind: sort
      title: Where does the foreign key go?
      intro: "For each relationship, choose the model."
      buckets:
        - { id: fk-many, label: "Foreign key on the 'many' side" }
        - { id: join, label: Join table (many-to-many) }
        - { id: same, label: "One-to-one (same table or shared key)" }
      items:
        - { id: hostel-rooms, text: "Hostel and its Rooms", bucket: fk-many, why: "rooms.hostel_id." }
        - { id: student-courses, text: "Students and Courses they enrol in", bucket: join, why: "enrolments(student_id, course_id)." }
        - { id: order-lines, text: "Order and its OrderLines", bucket: fk-many, why: "order_lines.order_id." }
        - { id: user-profile, text: "User and their single Profile", bucket: same, why: "Same table, or profile.user_id as primary key." }
        - { id: post-tags, text: "Posts and Tags", bucket: join, why: "post_tags(post_id, tag_id)." }
        - { id: author-books, text: "Authors and Books (books can have co-authors)", bucket: join, why: "Many-to-many because of co-authors." }

  boss:
    name: The Anomaly Ghoul
    taunt: "Update one row, forget thirteen. I live in your duplicated data."
    questions:
      - prompt: "Interviewer: “What is normalisation and why do it?”"
        choices:
          - text: "Organising tables so each fact is stored once, preventing update, insert and delete anomalies."
            correct: true
            why: "1NF, 2NF, 3NF in practice: one fact, one place."
          - text: "Making column types consistent across all tables, so joins and comparisons never need any casts."
            why: "Consistent types are good hygiene, but normalisation is about storing each fact once."
          - text: "Splitting a big table across servers so each holds less data."
            why: "That's sharding."
      - prompt: "Natural key (email) or surrogate key (an id) as the primary key?"
        choices:
          - text: "A surrogate id as the key, plus a UNIQUE constraint on email: emails change, and foreign keys would follow."
            correct: true
            why: "Stable identifiers for relationships."
          - text: "Always the email, since it's already unique, readable, and avoids an extra column and index."
            why: "Emails change."
          - text: "Both: a composite primary key of id and email together."
            why: "A composite key that includes the email still changes when the email does."
      - prompt: "How do classes map to tables in an LLD answer?"
        choices:
          - text: "Entities become tables, associations become foreign keys or join tables, and value objects become columns."
            correct: true
            why: "Object–relational mapping choices."
          - text: "Every class becomes exactly one table, and every field becomes a column, including the lists."
            why: "Lists become join tables, and value objects become columns, not tables."
          - text: "Classes and tables are designed separately; an ORM maps them later."
            why: "The mapping is part of the design."

  recall:
    kind: cloze
    prompt: Schema design from memory.
    text: "Each table has a [[primary key]], and relationships use [[foreign keys]]. In one-to-many, the key goes on the [[many]] side. Many-to-many needs a [[join table]]. [[Normalisation]] stores each fact once, and you can [[denormalise]] deliberately for read-heavy screens."
    bank: [primary key, foreign keys, many, join table, Normalisation, denormalise, one, index, cursor, encryption]

  codex:
    oneLiner: "Entities → tables with keys; foreign keys for one-to-many, join tables for many-to-many; normalise, constrain, index, and denormalise only on purpose."
    analogy: "A school office's filing system: one file per student, one per class, and an enrolment register linking them, instead of copying each student's details into every class list."
    keyPoints:
      - "Surrogate primary keys; UNIQUE on natural keys."
      - "1:N → FK on the many side; M:N → join table; 1:1 → same table or shared key."
      - "Normalise (no repeating groups, no duplicated facts)."
      - "Constraints: NOT NULL, UNIQUE, CHECK, FK, exclusion."
      - "Index for your queries; denormalise with a reason."
      - "Inheritance: single table with type column, or table per class."
    whenToUse:
      - "LLD rounds that ask for persistence; any new service's data model."
    whenNotToUse:
      - "Analytics stores and caches, which are often denormalised by design."
    interviewTells:
      - "“Design the schema”, “what tables would you have?”, “how do you store this?”."
    pitfalls:
      - Comma-separated lists in columns.
      - Duplicated facts.
      - Invariants only in app code.

  cards:
    - prompt: "Students and Clubs: a student joins many clubs, a club has many students. Schema?"
      choices:
        - text: "students, clubs, and a join table memberships(student_id, club_id)."
          correct: true
          why: "Many-to-many."
        - text: "A club_ids array column in students, plus a student_ids column in clubs."
          why: Can't index or constrain a list.
        - text: "A club_id foreign key on students."
          why: "One foreign key allows only one club per student."
