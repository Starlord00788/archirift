id: hld-distributed-transactions
title: The Trip That Half-Booked
summary: "A travel app books a train, a hotel and a cab across three services. The hotel fails, but the train ticket is already paid for. Compare two-phase commit with sagas, and write compensating actions."
world: reliability
order: 4
difficulty: 3
type: sequence-builder
concepts: [distributed-transactions]
prerequisites: [microservices, idempotency]
minutes: 11
primaryVisual: architecture
whenNotToUse: "If the data can live in one database, use a normal ACID transaction. Distributed transactions are the price of splitting data, so avoid splitting tightly coupled data."

rift:
  pain:
    scene: |
      **TripMate** books weekend trips. One “Book trip” tap calls three services in turn: **Train** (charges ₹1,200), **Hotel**, **Cab**.

      The hotel is full. The app shows an error, but the train ticket is already booked and paid for. No database transaction spans three services, so nothing rolls back.
    prompt: "How should TripMate keep the trip all-or-nothing?"
    options:
      - text: "Use a saga: a sequence of local transactions, each with a compensating action that undoes it if a later step fails."
        outcome: "Cancel the train (refund) when the hotel fails. Eventually consistent, but always consistent in the end."
      - text: "Wrap all three in one SQL transaction."
        outcome: "There is no single database to hold that transaction."
      - text: "Just show a nicer error."
        outcome: "The customer still paid for a train to nowhere."
    lesson: "**Two-phase commit (2PC)**: a coordinator asks every participant to *prepare* (lock and vote), then tells all to *commit* or *abort*. Atomic, but blocking and fragile if the coordinator dies. **Sagas**: a chain of local transactions, each paired with a **compensating transaction**; run by **orchestration** (a central coordinator) or **choreography** (services reacting to events). Sagas are eventually consistent and need idempotent, retryable steps."

  play:
    - kind: order
      title: Run the saga
      intro: "The hotel fails. Put the orchestrated saga's steps in order."
      items:
        - { id: start, text: "Orchestrator records **TripRequested**", why: "The saga's state is persisted so it survives crashes." }
        - { id: train, text: "**Train**: book and charge ₹1,200 (succeeds)", why: "Local transaction 1." }
        - { id: hotel, text: "**Hotel**: reserve a room (fails: sold out)", why: "Local transaction 2 fails." }
        - { id: comp-train, text: "**Compensate Train**: cancel the ticket and refund ₹1,200", why: "Undo the completed steps, in reverse order." }
        - { id: failed, text: "Orchestrator marks **TripFailed** and notifies the user", why: "A consistent final state." }
    - kind: sort
      title: 2PC or saga?
      intro: Which approach fits each situation?
      buckets:
        - { id: twopc, label: Two-phase commit }
        - { id: saga, label: Saga }
      items:
        - { id: trip, text: "Booking train, hotel and cab across three companies' APIs", bucket: saga, why: "External services can't join your locks; compensate instead." }
        - { id: db-shards, text: "An atomic write across two shards of your own database cluster, inside one data centre", bucket: twopc, why: "Short, internal, both participants support prepare/commit (XA, Spanner-style)." }
        - { id: long, text: "An order workflow that waits hours for a warehouse to pack", bucket: saga, why: "You can't hold locks for hours." }
        - { id: microservices, text: "Order, Payment and Inventory microservices, each with its own database", bucket: saga, why: "The standard microservice answer." }
        - { id: ledger, text: "Moving money between two accounts on two shards of a bank's core database", bucket: twopc, why: "Strict atomicity, controlled participants." }
    - kind: steps
      title: Make the saga robust
      intro: Sagas fail in interesting ways.
      steps:
        - prompt: "The refund call to Train times out. What should the orchestrator do?"
          options:
            - text: "Retry it with backoff until it works; compensations must be idempotent so retries are safe."
              correct: true
              feedback: "Compensations can't be allowed to fail permanently; retry, then escalate to a human."
            - text: "Mark the trip as failed and email the customer to request the train refund themselves."
              feedback: "The customer stays charged for a train they don't have."
        - prompt: "Between booking the train and cancelling it, another user saw the seat as taken. Is that a problem?"
          options:
            - text: "It's the saga trade-off: in-between states are visible. Use 'pending' states, or run the riskiest step first."
              correct: true
              feedback: "Sagas give up ACID's isolation (ACD, not ACID)."
            - text: "No: sagas keep each step's changes invisible to other users until the whole saga commits."
              feedback: "They don't; visible intermediate states are the price of sagas."
        - prompt: "Orchestration vs choreography?"
          options:
            - text: "Orchestration: a coordinator tells each service what to do. Choreography: services react to each other's events."
              correct: true
              feedback: "Choreography suits short flows; orchestration (Temporal, Step Functions) suits complex ones."
            - text: "Orchestration runs all the steps in parallel for speed; choreography runs them strictly one after another."
              feedback: "Either can be sequential or parallel; they differ in who owns the flow."

  boss:
    name: The Half-Committed Hydra
    taunt: "Prepared, but not committed. Committed, but not everywhere. Which head do you cut first?"
    questions:
      - prompt: "Interviewer: “What's the main weakness of two-phase commit?”"
        choices:
          - text: "It's blocking: participants hold locks while waiting, and if the coordinator dies after 'prepare', they're stuck."
            correct: true
            why: "Why microservices prefer sagas."
          - text: "It isn't atomic: a participant can commit while another aborts if messages arrive out of order."
            why: "Atomicity is exactly what it guarantees; the cost is blocking."
          - text: "It only works when every participant is the same database product, so mixed stacks can't use it."
            why: "XA lets different relational databases and queues take part."
      - prompt: "What's a compensating transaction?"
        choices:
          - text: "A new action that undoes an earlier committed step (refund a charge, release a room)."
            correct: true
            why: "Compensation, not rollback."
          - text: "A rollback of the earlier step's local database transaction, issued by the saga coordinator."
            why: "That step already committed; it can only be undone by a new action."
          - text: "A retry of the failed step with a different payload."
            why: "Retries try again; compensation undoes what already succeeded."
      - prompt: "How do you make sure a saga's events are published even if a service crashes right after its local commit?"
        choices:
          - text: "The outbox pattern: write the event in the same local transaction, then relay it afterwards."
            correct: true
            why: "Avoids the dual-write problem at every saga step."
          - text: "Publish the event to Kafka first, then commit the local transaction once Kafka acknowledges it."
            why: "Then events can announce work that never committed."
          - text: "Wrap the commit and the publish in a try/catch that retries the publish if it throws."
            why: "A crash, not an exception, kills the process between the two."

  recall:
    kind: cloze
    prompt: Distributed transactions from memory.
    text: "Two-phase commit has a [[prepare]] phase and a commit phase, run by a [[coordinator]], but it's blocking. A [[saga]] is a chain of local transactions, each with a [[compensating]] action. Sagas are run by [[orchestration]] or choreography, and are [[eventually]] consistent."
    bank: [prepare, coordinator, saga, compensating, orchestration, eventually, rollback, strongly, gateway, cache]

  codex:
    oneLiner: "Across services, use sagas (local transactions plus compensations); reserve two-phase commit for short, internal, tightly controlled participants."
    analogy: "Planning a group trip. 2PC: everyone holds their booking until all confirm, then all pay at once. Saga: each books as they go, and if the hotel falls through, everyone cancels in reverse order."
    keyPoints:
      - "2PC: prepare/vote, then commit/abort; atomic but blocking."
      - "Saga: local transactions with compensations, in reverse on failure."
      - "Orchestration (central) vs choreography (events)."
      - "Steps and compensations must be idempotent and retryable."
      - "No isolation: use pending states; outbox for events."
    whenToUse:
      - "Business workflows across microservices or external providers."
    whenNotToUse:
      - "When the data can share one database transaction."
    interviewTells:
      - "“Payment and inventory in different services”, “how do you keep them consistent?”, “saga”, “2PC”."
    pitfalls:
      - Non-idempotent compensations.
      - Ignoring visible intermediate states.
      - Dual writes without an outbox.

  cards:
    - prompt: "In a saga that booked Train, then Cab, then failed at Hotel, in what order do compensations run?"
      choices:
        - text: "Cancel Cab, then Train: reverse order of completion."
          correct: true
          why: "Unwind like a stack."
        - text: "Cancel Hotel first, then Cab, then Train."
          why: "Hotel never succeeded; there's nothing to undo."
        - text: "Train first, then Cab: the order they were booked in."
          why: "Compensations run in reverse: undo the most recent completed step first, like unwinding a stack."
