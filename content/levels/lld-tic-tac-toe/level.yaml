id: lld-tic-tac-toe
title: Design Tic-Tac-Toe (and Beyond)
summary: "A classic warm-up machine-coding round. Design it so that an N×N board, a bot player and a new win rule don't need rewrites."
world: agency
order: 8
difficulty: 1
type: blueprint-puzzle
concepts: [game-design-lld]
prerequisites: [strategy, srp]
minutes: 9
whenNotToUse: "If the interviewer explicitly wants the quickest 3×3 version, don't gold-plate it; mention where extension points would go."

rift:
  pain:
    scene: |
      Warm-up round: **“Build tic-tac-toe.”** Sameer writes a 3×3 `char[][]`, hard-codes the 8 winning lines, and puts input, rules and printing in `main()`.

      Then: *“Make it 4×4 with 4 in a row. Add a computer player. And print the board in the browser instead of the console.”* Every change touches `main()`.
    prompt: "What would have made those changes easy?"
    options:
      - text: "Separate responsibilities: Board, Player (human or bot), a winning-rule check, and the Game loop, with output separate from logic."
        outcome: "Each change then lands in one class."
      - text: "Writing faster."
        outcome: "Speed doesn't fix coupling."
      - text: "Using a game engine."
        outcome: "Overkill; this is about object design."
    lesson: "Split by responsibility: **Board** (cells, placing, N×N), **Player** (an interface: human or bot via a move **strategy**), **WinningStrategy** (row, column, diagonal checks for any N and K), and **Game** (turn loop and state: in progress, won, draw). Rendering is a separate concern."

  play:
    - kind: steps
      title: Design for change
      intro: Make the key decisions.
      steps:
        - prompt: "How do human and computer players fit the same game loop?"
          options:
            - text: "A `Player` interface with `nextMove(board)`; `HumanPlayer` reads input and `BotPlayer` uses a strategy."
              correct: true
              feedback: "The game loop just asks the current player for a move."
            - text: "An `isBot` flag on each player, checked in the game loop to decide whether to read input or compute a move."
              feedback: "Flags spread; each new player type adds a branch."
        - prompt: "How do you check for a win efficiently on an N×N board?"
          options:
            - text: "Keep counts per row, column and diagonal for each player; after a move, check only the ones it touched."
              correct: true
              feedback: "Interviewers love this optimisation: no full-board scan."
            - text: "After each move, scan only the row and column of that move, plus both diagonals if it's on them."
              feedback: "That's O(N) per move: better, but counters make it O(1)."
          after:
            code:
              language: java
              source: |
                class CountingWinChecker implements WinningStrategy {
                    private final int n;
                    private final Map<Symbol, int[]> rows = new HashMap<>(), cols = new HashMap<>();
                    private final Map<Symbol, int[]> diag = new HashMap<>(), anti = new HashMap<>();

                    public boolean isWin(Move m) {
                        int r = m.row(), c = m.col(); Symbol s = m.symbol();
                        if (++rows.computeIfAbsent(s, k -> new int[n])[r] == n) return true;
                        if (++cols.computeIfAbsent(s, k -> new int[n])[c] == n) return true;
                        if (r == c && ++diag.computeIfAbsent(s, k -> new int[1])[0] == n) return true;
                        return r + c == n - 1 && ++anti.computeIfAbsent(s, k -> new int[1])[0] == n;
                    }
                }
            diagram:
              nodes:
                - { id: Game, lines: ["state, current player"] }
                - { id: Board, lines: ["N×N cells"] }
                - { id: Player, kind: interface, lines: ["+ nextMove(board)"] }
                - { id: HumanPlayer }
                - { id: BotPlayer }
                - { id: WinningStrategy, kind: interface }
              edges:
                - { from: Game, to: Board, type: composes }
                - { from: Game, to: Player, type: has }
                - { from: Game, to: WinningStrategy, type: uses }
                - { from: HumanPlayer, to: Player, type: implements }
                - { from: BotPlayer, to: Player, type: implements }
        - prompt: "The interviewer asks for undo. What fits?"
          options:
            - text: "Keep moves on a stack (each a Command); undo pops one, clears the cell and lowers the counters."
              correct: true
              feedback: "Command pattern again: moves as objects."
            - text: "Copy the whole board before every move, and restore the last copy when undo is pressed."
              feedback: "Mementos work too, but a move stack is lighter."
    - kind: sort
      title: Who owns what?
      intro: Assign each responsibility to the right class.
      buckets:
        - { id: board, label: Board }
        - { id: game, label: Game }
        - { id: player, label: Player }
      items:
        - { id: place, text: Place a symbol and reject an occupied cell, bucket: board, why: "The board's own invariant." }
        - { id: full, text: Know whether all cells are filled, bucket: board, why: "Board state." }
        - { id: turns, text: Decide whose turn it is and detect a draw or win, bucket: game, why: "Game flow and status." }
        - { id: choose, text: Choose the next move, bucket: player, why: "Humans read input; bots compute." }
        - { id: status, text: "Move from IN_PROGRESS to WON or DRAW", bucket: game, why: "Game lifecycle." }

  boss:
    name: The Grandmaster Bot
    taunt: "X in the corner. Your design can't even handle a 4×4 board."
    questions:
      - prompt: "Interviewer: “How do you make the board size and win length configurable?”"
        choices:
          - text: "Pass N (and K in a row) into Board and the win check; never hard-code 3 or the 8 lines."
            correct: true
            why: "Parameterise; checks loop over N."
          - text: "Write a subclass of Board for each size, with its own list of winning lines."
            why: "Duplication."
          - text: "Use a bigger `char[][]` array for the board."
            why: "Size alone doesn't change the rules."
      - prompt: "Which algorithm makes an unbeatable 3×3 bot?"
        choices:
          - text: "Minimax with alpha-beta pruning, assuming both sides play perfectly."
            correct: true
            why: "Tic-tac-toe is small enough to search completely."
          - text: "Greedy: take a win if possible, else block the opponent, else pick a random square."
            why: "Beats beginners, but a fork (two threats at once) defeats it; minimax can't be beaten."
          - text: "Always play the centre first, then any corner."
            why: "A good opening heuristic, not a strategy."
      - prompt: "Which part is a natural Strategy?"
        choices:
          - text: "The bot's move-selection algorithm and the win check."
            correct: true
            why: "Both vary and can be swapped."
          - text: "The Board, so that it can be swapped for bigger ones."
            why: "The board is a core entity, not a varying algorithm."
          - text: "The X and O symbols."
            why: "Data, not behaviour."

  recall:
    kind: blueprint
    prompt: Rebuild the game's class model.
    palette: [Game, Board, Player, HumanPlayer, BotPlayer, WinningStrategy, Cell, GameUtils, MainLoop]
    relations: [composes, has, uses, implements]
    kinds: { Player: interface, WinningStrategy: interface }
    reference:
      nodes: [Game, Board, Player, HumanPlayer, BotPlayer, WinningStrategy]
      edges:
        - { from: Game, to: Board, type: composes }
        - { from: Game, to: Player, type: has }
        - { from: Game, to: WinningStrategy, type: uses }
        - { from: HumanPlayer, to: Player, type: implements }
        - { from: BotPlayer, to: Player, type: implements }
    acceptedExtras:
      nodes: [Cell]
      edges:
        - { from: Board, to: Cell, type: composes }

  codex:
    oneLiner: Board, Player (human or bot), WinningStrategy and Game, each with one job, parameterised by N, with O(1) win checks via counters.
    analogy: "A board game box: the board, the pieces, the rulebook and the players are separate things. Swap the rulebook or seat a new player without buying a new board."
    keyPoints:
      - "Board (cells, place, full), Game (turns, state), Player (nextMove), WinningStrategy."
      - Parameterise N and K; no hard-coded lines.
      - "O(1) win check with row, column and diagonal counters."
      - "Bots via strategies (random, minimax)."
      - "Undo with a stack of move commands."
    whenToUse:
      - Board-game LLD rounds (snake and ladder, chess, connect four).
    whenNotToUse:
      - Don't build networking or a UI in the round.
    interviewTells:
      - "“Design tic-tac-toe, snake and ladder, or chess”, “N×N”, “add a bot”."
    pitfalls:
      - Logic in main(), hard-coded 3×3, scanning the full board each move.

  cards:
    - prompt: "What's the O(1) trick for detecting a tic-tac-toe win on an N×N board?"
      choices:
        - text: "Raise per-player counters for the move's row, column and diagonals; a win is a counter hitting N."
          correct: true
          why: "Only the touched lines can have changed."
        - text: "Scan only the move's row, column and both diagonals each time a new piece is placed on the board."
          why: "That's O(N) per move; counters make it O(1)."
        - text: "Check the board once it's full, then count the lines."
          why: Wins happen earlier.
