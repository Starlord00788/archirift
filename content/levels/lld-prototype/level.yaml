id: lld-prototype
title: The Cloning Vat
summary: A game spawns 500 goblins a wave, each built from scratch with expensive setup, and the clones share one health bar. Copy pre-configured prototypes, deeply.
world: creational
order: 5
difficulty: 2
type: refactor-rush
concepts: [prototype]
prerequisites: [builder]
minutes: 7
whenNotToUse: "When objects are cheap to construct and have no complex shared configuration, cloning adds confusion (deep vs shallow) for no gain."

rift:
  pain:
    scene: |
      **DungeonDash** spawns 500 goblins every wave. Each `new Goblin()` loads a 3D model, parses an AI script and computes stats: 40 ms each, so a 20-second freeze per wave.

      An intern "fixes" it by copying fields from one goblin to the next. Now hitting any goblin damages all of them: they share one `Stats` object.
    code:
      language: java
      highlight: [4]
      source: |
        Goblin template = new Goblin("goblin.glb", "aggressive.ai");   // 40 ms
        Goblin copy = new Goblin();
        copy.model = template.model;      // fine: models are read-only
        copy.stats = template.stats;      // the bug: same Stats object!
        copy.stats.hp -= 10;              // every goblin loses 10 HP
    prompt: "Why do all the goblins lose health together?"
    options:
      - text: "Goblins are a hive mind."
        outcome: "Fun lore, but the cause is that the copy shares the same mutable `Stats` object instead of having its own."
      - text: "The garbage collector merged them."
        outcome: "The GC doesn't merge objects; two references point to one object."
      - text: "HP should be static."
        outcome: "That would guarantee every goblin shares one HP."
    lesson: "The **Prototype** pattern creates new objects by **copying** a configured prototype instead of building from scratch. The copy must be **deep** for mutable state (each goblin gets its own `Stats`) and may share immutable parts (the 3D model) to save memory."

  play:
    - kind: steps
      title: Clone safely
      intro: Turn the expensive goblin into a prototype.
      steps:
        - prompt: "How should goblins be created each wave?"
          options:
            - text: "Build one configured prototype once, then call `copy()` 500 times."
              correct: true
              feedback: "Pay the 40 ms setup once; copying is microseconds."
            - text: "Keep calling `new Goblin(...)`, but load the model and AI script in a background thread."
              feedback: "Background loading still repeats the setup 500 times; copy a prototype instead."
        - prompt: "What must `copy()` do with each field?"
          options:
            - text: "Share immutable data (the model, the AI script) and copy mutable state (stats, position)."
              correct: true
              feedback: "A selective deep copy: safe and memory-efficient."
            - text: "Copy every reference as-is (a shallow copy), since the fields are all set already."
              feedback: "That's the shared health bar bug."
            - text: "Deep-copy everything, including the 30 MB model."
              feedback: "Safe but wasteful: 500 × 30 MB of identical, read-only meshes."
          after:
            code:
              language: java
              highlight: [9, 10, 11]
              source: |
                final class Goblin implements Prototype<Goblin> {
                    private final Model model;      // immutable, safe to share
                    private final AiScript ai;      // immutable, safe to share
                    private Stats stats;            // mutable, must be copied
                    private Position position;      // mutable, must be copied

                    @Override
                    public Goblin copy() {
                        Goblin g = new Goblin(model, ai);
                        g.stats = stats.copy();
                        g.position = new Position(position);
                        return g;
                    }
                }
            diagram:
              nodes:
                - { id: WaveSpawner }
                - { id: Prototype, kind: interface, lines: ["+ copy()"] }
                - { id: Goblin, lines: ["model (shared)", "stats (copied)"] }
                - { id: Orc }
              edges:
                - { from: WaveSpawner, to: Prototype, type: uses }
                - { from: Goblin, to: Prototype, type: implements }
                - { from: Orc, to: Prototype, type: implements }
        - prompt: "Level designers want named presets: “boss goblin”, “archer goblin”, “speedy orc”. Where do they live?"
          options:
            - text: "In a **prototype registry**: a map from name to prototype, cloned on demand."
              correct: true
              feedback: "`registry.spawn(\"archer-goblin\")` copies the preset. Designers add presets without new classes."
            - text: "A subclass per preset, like `ArcherGoblin` and `BossGoblin`, each setting its stats."
              feedback: "Class explosion for what is only different data."
    - kind: sort
      title: Shallow or deep?
      intro: When copying a `Document`, which fields can be shared and which must be copied?
      buckets:
        - { id: share, label: Share the reference }
        - { id: copy, label: Copy deeply }
      items:
        - { id: font, text: An immutable `Font` object, bucket: share, why: "Immutable objects can never change underneath you." }
        - { id: title, text: "The `String` title", bucket: share, why: "Java strings are immutable." }
        - { id: pages, text: "A mutable `List<Page>`", bucket: copy, why: "Editing the copy's pages must not edit the original's." }
        - { id: comments, text: "A mutable `Map<User, Comment>`", bucket: copy, why: "Mutable collections need their own copy." }
        - { id: template, text: "A shared, read-only company template", bucket: share, why: "Shared on purpose; it's read-only." }

  boss:
    name: The Shallow Twin
    taunt: "We're copies! We share… everything. Hit me and you hit my brother."
    questions:
      - prompt: "Interviewer: “Explain shallow copy vs deep copy.”"
        choices:
          - text: "A shallow copy copies field values, sharing referenced objects; a deep copy also copies those, so copies are independent."
            correct: true
            why: "Shallow copies share nested mutable state, the source of shared health bars."
          - text: "A shallow copy copies only the primitive fields and sets every reference field to null, while a deep copy copies all fields."
            why: "It copies all fields, just not the objects they point to."
          - text: "A deep copy serialises the object, so it works only for `Serializable` classes."
            why: "Serialisation is one way to deep-copy; the definition is about copying referenced objects too."
      - prompt: "Why do many Java experts avoid `Cloneable` and `Object.clone()`?"
        choices:
          - text: "It's shallow by default, skips constructors and has an awkward contract; a `copy()` method is clearer."
            correct: true
            why: "Josh Bloch's Effective Java recommends copy constructors or copy factories."
          - text: "`clone()` is slow, because it copies the whole object through serialisation and back."
            why: "clone() doesn't serialise; the problems are shallowness and skipping constructors."
          - text: "Cloning only works on classes that have no constructor."
            why: "Any class can be cloned; clone() just skips constructors, which is part of the problem."
      - prompt: "When is Prototype a good choice?"
        choices:
          - text: "When creating an object is costly and many similar ones are needed, or presets are defined as data."
            correct: true
            why: "Copying a configured object beats rebuilding it."
          - text: "When you need exactly one instance of a class, shared by every part of the game at the very same time."
            why: "That's Singleton."
          - text: "When an object has many optional fields to set."
            why: "That's Builder."

  recall:
    kind: cloze
    prompt: Prototype from memory.
    text: "The Prototype pattern creates objects by [[copying]] a configured instance instead of building from scratch. A [[shallow]] copy shares referenced objects; a [[deep]] copy duplicates them. Immutable parts can be [[shared]], but [[mutable]] state must be copied. Named presets live in a prototype [[registry]]."
    bank: [copying, shallow, deep, shared, mutable, registry, static, inherited, singleton, serialised]

  codex:
    oneLiner: Create new objects by copying a pre-configured prototype, deep-copying mutable state and sharing immutable parts.
    analogy: "A photocopier for filled-in forms. You don't fill out 500 forms by hand; you complete one and copy it, then each copy is written on separately."
    keyPoints:
      - Pays expensive setup once; copies are cheap.
      - "**Shallow** copies share nested objects; **deep** copies duplicate them."
      - Share immutable data; copy mutable state.
      - A registry maps names to presets for data-driven creation.
      - "Prefer copy constructors or `copy()` over `Cloneable`."
    whenToUse:
      - Expensive construction (parsing, loading, network) and many similar objects.
      - Presets defined at runtime (game units, document templates).
    whenNotToUse:
      - Cheap objects; plain constructors are clearer.
    interviewTells:
      - "“Shallow vs deep copy”, “clone”, “object pool”, “game spawning”."
    pitfalls:
      - Shallow copies of mutable collections.
      - Circular references during deep copies.

  cards:
    - prompt: "After `b = a.shallowCopy()`, you call `b.tags.add(\"x\")` where `tags` is a mutable list. What happens to `a.tags`?"
      choices:
        - text: "It also has \"x\": both share the same list."
          correct: true
          why: "A shallow copy shares references."
        - text: "Nothing changes in `a`; it keeps its own list."
          why: That would need a deep copy.
        - text: "It throws an exception."
          why: Lists are happy to be shared, which is the danger.
