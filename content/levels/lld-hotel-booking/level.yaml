id: lld-hotel-booking
title: Design a Hotel Management System
summary: "A guest house double-books room 204 for Diwali weekend. Model rooms, date-range availability, reservations with holds, pricing rules, payments and cancellations, without overlaps."
world: agency
order: 15
difficulty: 3
type: blueprint-puzzle
concepts: [hotel-booking]
prerequisites: [movie-booking, strategy, locking-mechanisms]
minutes: 12
whenNotToUse: "Don't model housekeeping rosters and minibar inventory unless asked; focus on availability, booking and payment."

rift:
  pain:
    scene: |
      **StayInn** checks availability with `if (room.isAvailable)`, a single boolean. A guest books room 204 for Nov 1–3; another books it for Nov 2–4. The boolean was `true` when each checked, and both got confirmation emails.
    prompt: "What's wrong with a boolean 'available'?"
    options:
      - text: "Availability depends on dates: a room is booked per night, so you must check for overlapping date ranges, atomically."
        outcome: "Model reservations with check-in/check-out and check overlaps under a lock or constraint."
      - text: "The boolean should default to false."
        outcome: "Still meaningless without dates."
      - text: "Guests should call first."
        outcome: "No."
    lesson: "Entities: **Hotel**, **RoomType** (deluxe, suite), **Room**, **Guest**, **Reservation** (room, dates, status), **Payment**, **Invoice**. Availability is a **date-range overlap** check: two stays overlap when `aStart < bEnd && bStart < aEnd`. Reservations go **Pending (held, expiring) → Confirmed → CheckedIn → CheckedOut** or **Cancelled**. **Pricing** (seasonal, weekend, long-stay) and **cancellation policies** are strategies. Guard against double booking atomically."

  play:
    - kind: sort
      title: Do the stays overlap?
      intro: "Room 204 is booked Nov 1 → Nov 3 (check-out morning of Nov 3). Does each new request clash?"
      buckets:
        - { id: clash, label: Clash }
        - { id: ok, label: No clash }
      items:
        - { id: n2-4, text: "Nov 2 → Nov 4", bucket: clash, why: "Shares the night of Nov 2." }
        - { id: n3-5, text: "Nov 3 → Nov 5", bucket: ok, why: "Check-in on the check-out day is fine: end is exclusive." }
        - { id: o30-n1, text: "Oct 30 → Nov 1", bucket: ok, why: "Leaves the morning the other arrives." }
        - { id: o31-n4, text: "Oct 31 → Nov 4", bucket: clash, why: "Covers the whole stay." }
        - { id: n1-2, text: "Nov 1 → Nov 2", bucket: clash, why: "Same first night." }
    - kind: steps
      title: Model it
      intro: Design the booking core.
      steps:
        - prompt: "How do you find available rooms of a type for given dates?"
          options:
            - text: "Rooms of that type minus those with a live reservation overlapping the dates (`start < newEnd AND newStart < end`)."
              correct: true
              feedback: "The interval overlap test is the heart of the problem."
            - text: "Rooms of that type whose `available` flag is true, set false at booking and true again at check-out."
              feedback: "One flag can't represent dates: a room booked for next week would show as taken today."
          after:
            diagram:
              nodes:
                - { id: Hotel }
                - { id: RoomType }
                - { id: Room }
                - { id: Reservation, lines: ["checkIn, checkOut", "status"] }
                - { id: Guest }
                - { id: PricingStrategy, kind: interface }
                - { id: BookingService }
              edges:
                - { from: Hotel, to: Room, type: composes }
                - { from: Room, to: RoomType, type: has }
                - { from: Reservation, to: Room, type: has }
                - { from: Reservation, to: Guest, type: has }
                - { from: BookingService, to: PricingStrategy, type: uses }
                - { from: BookingService, to: Reservation, type: creates }
        - prompt: "Two guests submit overlapping bookings for the last deluxe room at the same moment. How do you prevent both succeeding?"
          options:
            - text: "Check and insert atomically: lock the room row (SELECT FOR UPDATE) in a transaction, or use an exclusion constraint."
              correct: true
              feedback: "Check-then-insert must be atomic."
            - text: "Check for overlaps first, then insert the booking in a second query a moment later in the same request."
              feedback: "Both checks pass before either insert."
        - prompt: "The guest is entering card details. What state is the reservation in?"
          options:
            - text: "Pending, holding the room for 10 minutes; confirmed on payment, released if it expires."
              correct: true
              feedback: "Same idea as seat holds in BookMyShow."
            - text: "Confirmed already, and cancelled by a nightly job if the payment never arrives."
              feedback: "Unpaid confirmations block rooms until the nightly job runs; a short expiring hold is better."
        - prompt: "Weekend rates, Diwali surcharges and 10% off for 7+ nights. Design?"
          options:
            - text: "A `PricingStrategy` per rule, composed in order: base, then seasonal, then the long-stay discount."
              correct: true
              feedback: "New offers are new classes."
            - text: "One `calculatePrice()` in BookingService with a separate branch for weekends, festivals and long stays."
              feedback: "Grows forever."

    - kind: code
      title: "Code it: availability"
      intro: "Write the overlap check and the availability search. Dates are \"YYYY-MM-DD\" strings, which compare correctly as text, and the check-out day is exclusive."
      hint: "Two stays overlap when each starts before the other ends: a.checkIn < b.checkOut && b.checkIn < a.checkOut."
      starter: |
        // a and b look like { checkIn: "2026-11-01", checkOut: "2026-11-03" }
        function overlaps(a, b) {
          // TODO
          return false;
        }

        // rooms: ["101", "102"]; reservations: [{ room, checkIn, checkOut, status }]
        // Return the rooms with no overlapping reservation, ignoring CANCELLED ones.
        function availableRooms(rooms, reservations, request) {
          // TODO
          return [];
        }
      solution: |
        function overlaps(a, b) {
          return a.checkIn < b.checkOut && b.checkIn < a.checkOut;
        }

        function availableRooms(rooms, reservations, request) {
          return rooms.filter((room) =>
            !reservations.some((r) => r.room === room && r.status !== "CANCELLED" && overlaps(r, request)));
        }
      tests:
        - name: Overlapping stays clash
          code: |
            assert(overlaps({ checkIn: '2026-11-01', checkOut: '2026-11-03' }, { checkIn: '2026-11-02', checkOut: '2026-11-04' }));
        - name: A stay inside another clashes
          code: |
            assert(overlaps({ checkIn: '2026-10-30', checkOut: '2026-11-05' }, { checkIn: '2026-11-01', checkOut: '2026-11-02' }));
        - name: Back-to-back stays don't clash
          code: |
            assert(!overlaps({ checkIn: '2026-11-01', checkOut: '2026-11-03' }, { checkIn: '2026-11-03', checkOut: '2026-11-05' }));
        - name: Finds free rooms and ignores cancellations
          code: |
            const res = [
              { room: '101', checkIn: '2026-11-01', checkOut: '2026-11-03', status: 'CONFIRMED' },
              { room: '102', checkIn: '2026-11-02', checkOut: '2026-11-05', status: 'CANCELLED' },
            ];
            assertEqual(availableRooms(['101', '102', '103'], res, { checkIn: '2026-11-02', checkOut: '2026-11-04' }), ['102', '103']);
        - name: A room frees up on its check-out day
          code: |
            const res = [{ room: '101', checkIn: '2026-11-01', checkOut: '2026-11-03', status: 'CONFIRMED' }];
            assertEqual(availableRooms(['101'], res, { checkIn: '2026-11-03', checkOut: '2026-11-04' }), ['101']);

  boss:
    name: The Double-Booked Suite
    taunt: "Two families. One suite. Same Diwali weekend. Surprise!"
    questions:
      - prompt: "Interviewer: “Book by room type or by specific room?”"
        choices:
          - text: "Usually by type (availability per type per night), assigning a room at check-in, which lets you move guests."
            correct: true
            why: "How real hotels work."
          - text: "Always a specific room at booking, so the guest knows exactly which room they'll stay in and on which floor."
            why: "Less flexible, though some hotels do it."
          - text: "By floor, then room."
            why: "Floors aren't how guests book; count availability by room type."
      - prompt: "How do you handle overbooking on purpose (airlines do it)?"
        choices:
          - text: "Allow bookings up to capacity × a factor per type, with a policy for walked guests: a business rule."
            correct: true
            why: "Make it explicit and configurable."
          - text: "It's always a bug: never allow more bookings than rooms, and reject every request beyond."
            why: "Some businesses choose it deliberately."
          - text: "Let every booking through and sort it out at check-in."
            why: "Without a cap you could sell three times the rooms; overbooking needs a limit."
      - prompt: "Where does the Reservation's lifecycle logic live?"
        choices:
          - text: "In Reservation, as a state machine (Pending → Confirmed → CheckedIn → CheckedOut) enforcing transitions."
            correct: true
            why: "Encapsulated state transitions."
          - text: "In each controller that touches a reservation, which checks the status field before changing it to the next one."
            why: "Hard to keep consistent."
          - text: "In the Room class, since the room is what gets booked."
            why: "A room has many reservations over time; the lifecycle belongs to each reservation."

  recall:
    kind: blueprint
    prompt: Sketch the hotel booking model.
    palette: [Hotel, Room, RoomType, Reservation, Guest, BookingService, PricingStrategy, Payment, TrafficSignal, Logger]
    relations: [composes, has, uses, creates]
    kinds: { PricingStrategy: interface }
    reference:
      nodes: [Hotel, Room, RoomType, Reservation, Guest, BookingService, PricingStrategy]
      edges:
        - { from: Hotel, to: Room, type: composes }
        - { from: Room, to: RoomType, type: has }
        - { from: Reservation, to: Room, type: has }
        - { from: Reservation, to: Guest, type: has }
        - { from: BookingService, to: PricingStrategy, type: uses }
        - { from: BookingService, to: Reservation, type: creates }
    acceptedExtras:
      nodes: [Payment]
      edges:
        - { from: Reservation, to: Payment, type: has }

  codex:
    oneLiner: "Date-range availability via interval overlap, atomic booking, expiring holds, a reservation state machine, and pricing/cancellation strategies."
    analogy: "A hotel's paper register with one row per room and a column per night: you can only write your name where every night of your stay is blank, and you hold the pen so nobody writes at the same time."
    keyPoints:
      - "Overlap: aStart < bEnd && bStart < aEnd (end exclusive)."
      - "Atomic check-and-insert: row lock or exclusion constraint."
      - "Pending holds with expiry; then Confirmed."
      - "Reservation lifecycle as a state machine."
      - "Pricing and cancellation as strategies."
      - "Book by room type; assign rooms later."
    whenToUse:
      - "“Design a hotel / Airbnb / meeting-room booking system”."
    whenNotToUse:
      - "Over-modelling operations like housekeeping."
    interviewTells:
      - "“Hotel booking”, “availability for dates”, “double booking”."
    pitfalls:
      - Boolean availability.
      - Non-atomic checks.
      - Holds that never expire.

  cards:
    - prompt: "Stay A: Nov 5 → Nov 8. Stay B: Nov 8 → Nov 10 (same room). Conflict?"
      choices:
        - text: "No: A leaves the morning B arrives (the end date is exclusive)."
          correct: true
          why: "8 < 8 is false."
        - text: "Yes: both stays include Nov 8, so they overlap by a day."
          why: Nov 8 isn't a night of stay A.
        - text: "Only if B checks in before noon."
          why: "Check-in times are policy; counted in nights, A's last night is Nov 7."
