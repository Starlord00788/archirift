# Concepts in the knowledge graph. Every level, card and Atlas node refers to these ids.
- id: polymorphism
  name: Polymorphism
  tier: core
  world: objects
  rule: One interface, many implementations, chosen at runtime.
  aliases: [runtime polymorphism, dynamic dispatch]

- id: open-closed
  name: Open/Closed principle
  tier: core
  world: laws
  rule: Add new behaviour by adding code, not by editing code that already works.
  aliases: [ocp, open closed principle]

- id: strategy
  name: Strategy pattern
  tier: core
  world: behavioral
  rule: Put each interchangeable algorithm behind one interface and inject the one you need.
  aliases: [strategy, policy pattern]
  analogy:
    scene: A maps app switching between car, bike and walking routes.
    breaksWhen: Real strategies sometimes need different inputs, and forcing them behind one interface can leak details.
  misconceptions:
    - claim: Strategy and State are the same pattern because both swap objects.
      correction: A State object changes itself as events arrive; a Strategy is chosen by the caller and does not change on its own.

- id: state
  name: State pattern
  tier: core
  world: behavioral
  rule: Let an object change its behaviour by switching between state objects as events arrive.
  aliases: [state machine pattern]
  analogy:
    scene: A vending machine that refuses snacks until it has been paid.
    breaksWhen: With only two or three states that never change, a small switch statement is simpler.

- id: parking-lot
  name: Parking Lot (machine-coding problem)
  tier: core
  world: agency
  rule: Model spots, vehicles, floors and pricing so new spot types and pricing rules can be added without edits.
  aliases: [parking lot design, design a parking lot]

- id: singleton
  name: Singleton pattern
  tier: core
  world: creational
  rule: One instance per process, created safely, reached through one access point.
  aliases: [singleton]
  analogy:
    scene: A country's single official mint.
    breaksWhen: The state must be shared across many servers, or it's just a global variable in disguise.

# ---------------- Scaling City ----------------
- id: request-lifecycle
  name: Request lifecycle
  tier: core
  world: scaling
  rule: A request crosses DNS, TCP, TLS, a load balancer, app code, caches and databases; latency is the sum of the hops.
  aliases: [what happens when you type a url]

- id: horizontal-scaling
  name: Vertical vs horizontal scaling
  tier: core
  world: scaling
  rule: Scale up with a bigger machine to start; scale out with many identical stateless machines to grow and survive failures.
  aliases: [scale out, scale up, vertical scaling]

- id: load-balancing
  name: Load balancing
  tier: core
  world: scaling
  rule: Spread requests across healthy servers with an algorithm that matches how uneven the work is.
  aliases: [load balancer, lb]

- id: caching
  name: Caching
  tier: core
  world: scaling
  rule: Keep hot data in memory close to the app, and decide deliberately how it stays fresh.
  aliases: [cache, cache-aside, redis]

- id: cdn
  name: CDN
  tier: core
  world: scaling
  rule: Cache static content on edge servers near users to cut latency and shield the origin.
  aliases: [content delivery network]

- id: capacity-estimation
  name: Back-of-the-envelope estimation
  tier: core
  world: scaling
  rule: Turn users into QPS, storage and bandwidth with rounded numbers before choosing a design.
  aliases: [capacity planning, napkin math]

# ---------------- Object Foundry ----------------
- id: encapsulation
  name: Encapsulation
  tier: core
  world: objects
  rule: Keep data private and change it only through methods that enforce the object's rules.
  aliases: [information hiding]

- id: abstraction
  name: Abstraction and interfaces
  tier: core
  world: objects
  rule: Expose what a thing does through a small contract and hide how it does it.
  aliases: [interface, abstract class]

- id: composition-over-inheritance
  name: Composition over inheritance
  tier: core
  world: objects
  rule: Combine small behaviour objects (has-a) instead of inheriting behaviour from deep class trees (is-a).
  aliases: [favour composition]

- id: uml-relationships
  name: UML class relationships
  tier: important
  world: objects
  rule: Association, aggregation, composition, dependency, inheritance and realisation say how tightly classes are bound.
  aliases: [class diagram, aggregation vs composition]

# ---------------- Hall of Laws ----------------
- id: srp
  name: Single Responsibility Principle
  tier: core
  world: laws
  rule: A class should have one reason to change, answering to one actor.
  aliases: [single responsibility]

- id: lsp
  name: Liskov Substitution Principle
  tier: core
  world: laws
  rule: A subtype must be usable anywhere its parent is without surprising callers.
  aliases: [liskov]

- id: isp
  name: Interface Segregation Principle
  tier: core
  world: laws
  rule: Clients shouldn't depend on methods they don't use; prefer small role interfaces.
  aliases: [interface segregation]

- id: dip
  name: Dependency Inversion Principle
  tier: core
  world: laws
  rule: High-level policy depends on abstractions it owns; details implement them and are injected.
  aliases: [dependency inversion, dependency injection, di]

- id: dry-kiss-yagni
  name: DRY, KISS and YAGNI
  tier: important
  world: laws
  rule: One source of truth for knowledge, the simplest design that works, and nothing built before it's needed.
  aliases: [dry, kiss, yagni]

# ---------------- Creational Forge ----------------
- id: factory-method
  name: Factory Method
  tier: core
  world: creational
  rule: Centralise object creation behind a product interface; let subclasses choose the concrete product.
  aliases: [factory, simple factory]

- id: abstract-factory
  name: Abstract Factory
  tier: core
  world: creational
  rule: One factory interface creates a whole family of related products that must match.
  aliases: [kit]

- id: builder
  name: Builder
  tier: core
  world: creational
  rule: Construct complex objects step by step with named methods and validate once in build().
  aliases: [fluent builder]

- id: prototype
  name: Prototype
  tier: important
  world: creational
  rule: Create objects by copying a configured prototype, deep-copying mutable state.
  aliases: [clone]

# ---------------- Structural Bridges ----------------
- id: adapter
  name: Adapter
  tier: core
  world: structural
  rule: Wrap an incompatible class so it presents the interface your code expects.
  aliases: [wrapper, ports and adapters]

- id: decorator
  name: Decorator
  tier: core
  world: structural
  rule: Wrap an object with the same interface to add behaviour, and stack wrappers at runtime.
  aliases: [wrapper]

- id: facade
  name: Facade
  tier: core
  world: structural
  rule: One simple entry point for a complex subsystem that owns the choreography.
  aliases: [front controller]

- id: proxy
  name: Proxy
  tier: core
  world: structural
  rule: A stand-in with the same interface that controls access to the real object.
  aliases: [virtual proxy, protection proxy, remote proxy]

- id: composite
  name: Composite
  tier: core
  world: structural
  rule: Give leaves and containers one interface so a tree can be treated like a single object.
  aliases: [tree structure]

- id: bridge
  name: Bridge
  tier: important
  world: structural
  rule: Split two independently varying dimensions into two hierarchies joined by composition.
  aliases: [handle body]

- id: flyweight
  name: Flyweight
  tier: important
  world: structural
  rule: Share heavy, immutable intrinsic state across many objects and keep only extrinsic state per object.
  aliases: [object sharing]

# ---------------- Behavioral Arcade ----------------
- id: observer
  name: Observer
  tier: core
  world: behavioral
  rule: A subject notifies a list of subscribers through one interface, so listeners can come and go.
  aliases: [listener, publish subscribe, event listener]

- id: command
  name: Command
  tier: core
  world: behavioral
  rule: Turn a request into an object with execute and undo so it can be stored, queued and reversed.
  aliases: [action object, undo]

- id: template-method
  name: Template Method
  tier: core
  world: behavioral
  rule: A final base-class method fixes the algorithm's steps; subclasses fill in the varying ones.
  aliases: [hollywood principle]

- id: chain-of-responsibility
  name: Chain of Responsibility
  tier: core
  world: behavioral
  rule: Pass a request along a chain of handlers until one handles it.
  aliases: [middleware chain, escalation]

- id: iterator
  name: Iterator
  tier: important
  world: behavioral
  rule: Traverse a collection through an iterator without exposing how it's stored.
  aliases: [cursor]

- id: mediator
  name: Mediator
  tier: important
  world: behavioral
  rule: Centralise how a group of objects interact so they talk to one mediator, not to each other.
  aliases: [controller, hub]

- id: memento
  name: Memento
  tier: important
  world: behavioral
  rule: An object snapshots its own state into an opaque token that others store and hand back.
  aliases: [snapshot, checkpoint]

- id: visitor
  name: Visitor
  tier: important
  world: behavioral
  rule: Put each operation in a visitor with one method per element type; elements accept visitors.
  aliases: [double dispatch]

# ---------------- Engine Room ----------------
- id: race-conditions
  name: Race conditions and locks
  tier: core
  world: concurrency
  rule: Read-check-write on shared state must be atomic, or timing decides the result.
  aliases: [thread safety, mutex, critical section]

- id: deadlock
  name: Deadlock
  tier: core
  world: concurrency
  rule: Threads waiting on each other's locks in a cycle freeze; break a Coffman condition, usually with a global lock order.
  aliases: [dining philosophers, livelock]

- id: producer-consumer
  name: Producer-consumer
  tier: core
  world: concurrency
  rule: A bounded blocking queue decouples producing work from a pool of consumers, with backpressure.
  aliases: [blocking queue, thread pool]

# ---------------- Machine Coding Agency ----------------
- id: elevator-system
  name: Elevator system (machine coding)
  tier: core
  world: agency
  rule: Elevators are state machines serving stops in sweeps; a dispatcher strategy assigns hall calls.
  aliases: [design an elevator, lift system]

- id: splitwise
  name: Splitwise (machine coding)
  tier: core
  world: agency
  rule: Expenses with pluggable split strategies update net balances; settle greedily.
  aliases: [expense sharing, design splitwise]

- id: lru-cache
  name: LRU cache (machine coding)
  tier: core
  world: agency
  rule: A hash map plus a doubly linked list give O(1) get and put with least-recently-used eviction.
  aliases: [lru, least recently used]

- id: movie-booking
  name: BookMyShow (machine coding)
  tier: core
  world: agency
  rule: Per-show seat states with atomic, expiring holds prevent double-selling.
  aliases: [bookmyshow, ticket booking, seat booking]

- id: game-design-lld
  name: Board games (machine coding)
  tier: important
  world: agency
  rule: Separate board, players, rules and game flow; parameterise sizes and keep win checks O(1).
  aliases: [tic tac toe, snake and ladder, chess design]

- id: sql-vs-nosql
  name: SQL vs NoSQL
  tier: core
  world: data
  rule: Pick the data model from access patterns and consistency needs; relational is the safe default.
  aliases: [choosing a database, relational vs nosql, polyglot persistence]
  misconceptions:
    - claim: NoSQL is always faster and more scalable than SQL.
      correction: NoSQL stores trade joins and transactions for easier horizontal scaling; a well-indexed relational database is fast and scales further than most apps need.

- id: database-indexing
  name: Database indexing
  tier: core
  world: data
  rule: A sorted lookup structure (usually a B-tree) turns full scans into O(log n) seeks, at the cost of slower writes.
  aliases: [index, b-tree, composite index, covering index]

- id: replication
  name: Replication
  tier: core
  world: data
  rule: Copy writes from a primary to replicas to scale reads and survive failures; manage replication lag.
  aliases: [read replicas, leader follower, master slave, failover]
  misconceptions:
    - claim: A replica is a backup.
      correction: Mistakes like an accidental DELETE replicate instantly; backups are point-in-time copies.

- id: sharding
  name: Sharding
  tier: core
  world: data
  rule: Split rows across databases by a shard key to scale writes; choose keys for even spread and single-shard queries.
  aliases: [partitioning, horizontal partitioning, shard key, hot key]

- id: consistent-hashing
  name: Consistent hashing
  tier: core
  world: data
  rule: Place servers and keys on a hash ring so that membership changes move only about 1/N of the keys.
  aliases: [hash ring, virtual nodes]

- id: cap-theorem
  name: CAP theorem
  tier: core
  world: data
  rule: During a network partition, a distributed store must choose between consistency and availability.
  aliases: [cap, pacelc, cp vs ap]
  misconceptions:
    - claim: You pick any two of consistency, availability and partition tolerance.
      correction: Partitions happen whether you like it or not; the real choice is what to give up while one is happening (and latency vs consistency the rest of the time, per PACELC).

- id: consistency-models
  name: Consistency models
  tier: core
  world: data
  rule: Strong, read-your-writes, monotonic, causal and eventual consistency trade freshness for latency and availability; quorums tune the dial.
  aliases: [eventual consistency, strong consistency, quorum, linearizability]

- id: classes-objects
  name: Classes and objects
  tier: core
  world: objects
  rule: A class is a blueprint of state and behaviour; each object is one instance with its own state and identity.
  aliases: [class, object, instance, constructor, static, oop basics]
  misconceptions:
    - claim: "`==` compares two objects' contents."
      correction: "For objects, `==` compares identity (the same instance); use `equals` (with `hashCode`) for value equality."

- id: inheritance
  name: Inheritance
  tier: core
  world: objects
  rule: A subclass is-a specialised superclass; it reuses and overrides behaviour, at the cost of tight coupling.
  aliases: [extends, subclass, superclass, method overriding, super]
  misconceptions:
    - claim: Inheritance is mainly for reusing code.
      correction: Inherit for a true is-a relationship and substitutability; for plain reuse, prefer composition.

- id: uml-class-diagram
  name: UML class diagrams
  tier: core
  world: objects
  rule: A class box lists name, attributes and operations with visibility (+ - # ~), types and multiplicities.
  aliases: [class diagram, uml notation, visibility, multiplicity]

- id: uml-sequence-diagram
  name: UML sequence diagrams
  tier: important
  world: objects
  rule: Lifelines and time-ordered messages show how objects collaborate in one scenario.
  aliases: [sequence diagram, lifeline, interaction diagram]

- id: message-queue
  name: Message queues
  tier: core
  world: messaging
  rule: Producers enqueue work and return fast; workers consume at a sustainable pace, absorbing bursts asynchronously.
  aliases: [queue, sqs, rabbitmq, load levelling, dead letter queue, async processing]

- id: pub-sub
  name: Pub/sub and Kafka
  tier: core
  world: messaging
  rule: Producers publish events to topics; every subscriber group gets its own copy, and Kafka keeps a partitioned, replayable log.
  aliases: [publish subscribe, kafka, event driven, topics, consumer groups]

- id: realtime-communication
  name: Real-time communication
  tier: core
  world: messaging
  rule: Poll for rare changes, SSE for one-way streams, WebSockets for two-way, push for closed apps; fan out with pub/sub.
  aliases: [websockets, sse, server sent events, long polling]

- id: idempotency
  name: Idempotency and delivery guarantees
  tier: core
  world: messaging
  rule: Networks give at-least-once delivery; idempotency keys and dedupe turn retries into exactly-once effects.
  aliases: [idempotency key, exactly once, at least once, outbox pattern, retries with backoff]
  misconceptions:
    - claim: Kafka or TCP gives exactly-once delivery to your database and payment provider.
      correction: Those guarantees stop at their own boundary; side effects still need idempotent handling.

- id: rate-limiting
  name: Rate limiting
  tier: core
  world: reliability
  rule: Cap each client's request rate with a token bucket or sliding window, reject the excess with 429, and enforce it early with shared counters.
  aliases: [rate limiter, token bucket, leaky bucket, throttling, "429"]

- id: circuit-breaker
  name: Circuit breakers and resilience
  tier: core
  world: reliability
  rule: Timeouts, circuit breakers (closed, open, half-open), fallbacks and bulkheads stop one slow dependency from cascading.
  aliases: [circuit breaker, bulkhead, timeouts, cascading failure, retries]

- id: microservices
  name: Microservices
  tier: core
  world: reliability
  rule: Independently deployable services that each own a capability and its data, behind a gateway, with discovery and tracing.
  aliases: [api gateway, service discovery, monolith vs microservices, strangler fig, service mesh]

- id: distributed-transactions
  name: Distributed transactions
  tier: core
  world: reliability
  rule: Across services, use sagas with compensating actions; two-phase commit is atomic but blocking.
  aliases: [saga, two phase commit, 2pc, compensating transaction, orchestration, choreography]

- id: consensus
  name: Consensus and leader election
  tier: core
  world: reliability
  rule: Majority quorums and terms let 2f + 1 nodes agree on a leader and a log while surviving f failures.
  aliases: [raft, paxos, leader election, split brain, etcd, zookeeper, quorum]

- id: bloom-filter
  name: Bloom filters and sketches
  tier: important
  world: reliability
  rule: A bit array plus k hashes answers "definitely not" or "maybe" in tiny memory; HyperLogLog counts distinct items.
  aliases: [bloom filter, hyperloglog, count min sketch, probabilistic data structures]

- id: api-design
  name: API design
  tier: core
  world: reliability
  rule: Resources as nouns, HTTP methods and honest status codes, cursor pagination, and backward-compatible versioning.
  aliases: [rest, grpc, graphql, pagination, versioning, status codes]
