# Typed relationships between concepts. Types come from a fixed vocabulary (see src/content/schema.ts).
- from: polymorphism
  to: open-closed
  type: enables
  explanation: Callers depend on an interface, so new implementations can be added without editing the callers.
  chain: oop-to-interviews

- from: open-closed
  to: strategy
  type: realised-by
  explanation: Each new rule becomes a new Strategy class; the code that uses strategies stays closed for modification.
  chain: oop-to-interviews

- from: strategy
  to: parking-lot
  type: used-in
  explanation: Pricing rules (hourly, weekend, EV charging) are interchangeable strategies.
  chain: oop-to-interviews

- from: open-closed
  to: state
  type: realised-by
  explanation: A new state is a new class; existing states and the context stay unchanged.

- from: strategy
  to: state
  type: contrasts-with
  explanation: Both swap objects behind an interface, but State transitions itself while Strategy is chosen from outside.

- from: request-lifecycle
  to: horizontal-scaling
  type: enables
  explanation: Knowing every hop shows which tier needs more capacity.

- from: horizontal-scaling
  to: load-balancing
  type: requires
  explanation: Many identical servers need something to spread requests across them.

- from: horizontal-scaling
  to: caching
  type: causes
  explanation: Scaling out the app tier moves the bottleneck to the database, which caching relieves.

- from: caching
  to: cdn
  type: is-a-kind-of
  explanation: A CDN is a geographically distributed HTTP cache.

- from: capacity-estimation
  to: horizontal-scaling
  type: enables
  explanation: Peak QPS tells you how many servers you need.

- from: encapsulation
  to: abstraction
  type: enables
  explanation: Hidden details are what an abstraction is free to change.

- from: abstraction
  to: polymorphism
  type: enables
  explanation: Callers program against an interface, and each implementation answers at runtime.

- from: polymorphism
  to: composition-over-inheritance
  type: enables
  explanation: Behaviour objects behind interfaces can be plugged in instead of inherited.

- from: composition-over-inheritance
  to: strategy
  type: realised-by
  explanation: Strategy is composition applied to interchangeable algorithms.

- from: srp
  to: isp
  type: enables
  explanation: ISP is single responsibility applied to interfaces, seen from the client's side.

- from: lsp
  to: polymorphism
  type: requires
  explanation: Polymorphism is only safe when every subtype keeps its parent's contract.

- from: dip
  to: open-closed
  type: enables
  explanation: Depending on abstractions lets you add implementations without editing callers.

- from: dry-kiss-yagni
  to: srp
  type: trades-off-against
  explanation: Splitting responsibilities can be overdone; keep things simple until change demands the split.
