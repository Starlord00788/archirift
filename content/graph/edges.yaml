# Typed relationships between concepts. Types come from a fixed vocabulary (see src/content/schema.ts).
- from: polymorphism
  to: open-closed
  type: enables
  explanation: Callers depend on an interface, so new implementations can be added without editing the callers.
  chain: oop-to-interviews

- from: open-closed
  to: strategy
  type: realised-by
  explanation: Each new rule becomes a new Strategy class; the code that uses strategies stays closed for modification.
  chain: oop-to-interviews

- from: strategy
  to: parking-lot
  type: used-in
  explanation: Pricing rules (hourly, weekend, EV charging) are interchangeable strategies.
  chain: oop-to-interviews

- from: open-closed
  to: state
  type: realised-by
  explanation: A new state is a new class; existing states and the context stay unchanged.

- from: strategy
  to: state
  type: contrasts-with
  explanation: Both swap objects behind an interface, but State transitions itself while Strategy is chosen from outside.

- from: request-lifecycle
  to: horizontal-scaling
  type: enables
  explanation: Knowing every hop shows which tier needs more capacity.

- from: horizontal-scaling
  to: load-balancing
  type: requires
  explanation: Many identical servers need something to spread requests across them.

- from: horizontal-scaling
  to: caching
  type: causes
  explanation: Scaling out the app tier moves the bottleneck to the database, which caching relieves.

- from: caching
  to: cdn
  type: is-a-kind-of
  explanation: A CDN is a geographically distributed HTTP cache.

- from: capacity-estimation
  to: horizontal-scaling
  type: enables
  explanation: Peak QPS tells you how many servers you need.

- from: encapsulation
  to: abstraction
  type: enables
  explanation: Hidden details are what an abstraction is free to change.

- from: abstraction
  to: polymorphism
  type: enables
  explanation: Callers program against an interface, and each implementation answers at runtime.

- from: polymorphism
  to: composition-over-inheritance
  type: enables
  explanation: Behaviour objects behind interfaces can be plugged in instead of inherited.

- from: composition-over-inheritance
  to: strategy
  type: realised-by
  explanation: Strategy is composition applied to interchangeable algorithms.

- from: srp
  to: isp
  type: enables
  explanation: ISP is single responsibility applied to interfaces, seen from the client's side.

- from: lsp
  to: polymorphism
  type: requires
  explanation: Polymorphism is only safe when every subtype keeps its parent's contract.

- from: dip
  to: open-closed
  type: enables
  explanation: Depending on abstractions lets you add implementations without editing callers.

- from: dry-kiss-yagni
  to: srp
  type: trades-off-against
  explanation: Splitting responsibilities can be overdone; keep things simple until change demands the split.

- from: factory-method
  to: abstract-factory
  type: part-of
  explanation: Each create method of an abstract factory is typically a factory method.

- from: factory-method
  to: dip
  type: enables
  explanation: Callers depend on the product interface; only the factory knows concrete classes.

- from: builder
  to: encapsulation
  type: requires
  explanation: The builder hides half-built state and only releases a valid, immutable object.

- from: prototype
  to: builder
  type: contrasts-with
  explanation: Builder assembles an object from parts; Prototype copies a finished one.

- from: singleton
  to: dip
  type: trades-off-against
  explanation: A global access point hides a dependency; injecting the single instance keeps code testable.

- from: adapter
  to: facade
  type: contrasts-with
  explanation: Adapter translates one existing interface; Facade simplifies a whole subsystem.

- from: decorator
  to: proxy
  type: contrasts-with
  explanation: Both wrap with the same interface; Decorator adds behaviour, Proxy controls access.

- from: composition-over-inheritance
  to: decorator
  type: realised-by
  explanation: Decorators combine behaviours by wrapping instead of subclassing every combination.

- from: composite
  to: polymorphism
  type: requires
  explanation: Containers delegate to children through one interface, whatever their concrete type.

- from: bridge
  to: strategy
  type: contrasts-with
  explanation: Both compose an interface; Bridge decouples two whole hierarchies, Strategy swaps one algorithm.

- from: flyweight
  to: caching
  type: contrasts-with
  explanation: Flyweight shares immutable objects in memory; a cache keeps copies of fetched data.

- from: observer
  to: mediator
  type: contrasts-with
  explanation: Observer broadcasts one subject's changes; Mediator coordinates two-way interactions among peers.

- from: command
  to: memento
  type: trades-off-against
  explanation: Both implement undo; commands reverse actions, mementos restore snapshots.

- from: template-method
  to: strategy
  type: contrasts-with
  explanation: Template Method varies steps through inheritance; Strategy through composition.

- from: composite
  to: visitor
  type: used-in
  explanation: Visitors add operations over composite trees without changing node classes.

- from: chain-of-responsibility
  to: observer
  type: contrasts-with
  explanation: A chain stops at the handler that takes the request; Observer notifies everyone.

- from: state
  to: command
  type: used-in
  explanation: State machines often trigger commands on transitions.

- from: race-conditions
  to: deadlock
  type: causes
  explanation: Locks fix races, but taking several locks in inconsistent orders can deadlock.

- from: race-conditions
  to: movie-booking
  type: used-in
  explanation: Seat holds must be atomic or two users get the same seat.

- from: producer-consumer
  to: race-conditions
  type: requires
  explanation: The shared queue must be thread-safe; blocking queues provide that.

- from: state
  to: elevator-system
  type: used-in
  explanation: Each elevator is a state machine (idle, moving, doors open).

- from: strategy
  to: splitwise
  type: used-in
  explanation: Equal, exact and percentage splits are interchangeable strategies.

- from: caching
  to: lru-cache
  type: realised-by
  explanation: LRU is the most common eviction policy for bounded caches.

- from: strategy
  to: game-design-lld
  type: used-in
  explanation: Bot move selection and win rules are swappable strategies.

- from: capacity-estimation
  to: sql-vs-nosql
  type: enables
  explanation: Read/write ratios and data size from the estimate decide which data model fits.
  chain: scale-the-data

- from: sql-vs-nosql
  to: database-indexing
  type: enables
  explanation: Once the model is chosen, indexes make its main queries fast.
  chain: scale-the-data

- from: database-indexing
  to: replication
  type: enables
  explanation: When indexed reads still overload one machine, replicas add read capacity.
  chain: scale-the-data

- from: replication
  to: sharding
  type: enables
  explanation: Replicas can't add write capacity; sharding splits the writes.
  chain: scale-the-data

- from: sharding
  to: consistent-hashing
  type: mitigated-by
  explanation: Modulo shard placement moves almost every key when shards change; a hash ring moves about 1/N.
  chain: scale-the-data

- from: replication
  to: cap-theorem
  type: causes
  explanation: Copies on several machines force a choice between consistency and availability when the network splits.
  chain: scale-the-data

- from: cap-theorem
  to: consistency-models
  type: enables
  explanation: Consistency models are the menu of in-between choices once you accept you can't have everything.
  chain: scale-the-data

- from: caching
  to: replication
  type: contrasts-with
  explanation: Both scale reads and both can serve stale data; caches hold hot subsets, replicas hold full copies.

- from: classes-objects
  to: encapsulation
  type: enables
  explanation: Once state and behaviour live together in a class, the class can guard that state.
  chain: oop-to-interviews

- from: abstraction
  to: inheritance
  type: realised-by
  explanation: An abstract superclass captures what subclasses share and leaves the details to them.
  chain: oop-to-interviews

- from: inheritance
  to: polymorphism
  type: enables
  explanation: Overridden methods let one call do different things depending on the runtime type.
  chain: oop-to-interviews

- from: inheritance
  to: composition-over-inheritance
  type: trades-off-against
  explanation: Inheritance couples subclasses to the parent's internals; composition swaps behaviour at runtime.

- from: inheritance
  to: lsp
  type: requires
  explanation: A subclass is only safe if it can stand in for its parent everywhere.

- from: uml-class-diagram
  to: uml-relationships
  type: part-of
  explanation: Class boxes are the nouns of a class diagram; relationships are its verbs.

- from: uml-relationships
  to: uml-sequence-diagram
  type: contrasts-with
  explanation: Class diagrams show structure; sequence diagrams show behaviour over time.

- from: srp
  to: open-closed
  type: enables
  explanation: Small, focused classes are easier to extend without editing.
  chain: oop-to-interviews

- from: replication
  to: message-queue
  type: contrasts-with
  explanation: Replicas scale reads; a queue smooths writes in time without adding database capacity.

- from: message-queue
  to: pub-sub
  type: enables
  explanation: A queue delivers each message to one worker; pub/sub fans every event out to many independent subscribers.
  chain: async-systems

- from: pub-sub
  to: realtime-communication
  type: used-in
  explanation: Connection servers subscribe to channels and push each event to their connected clients.
  chain: async-systems

- from: message-queue
  to: idempotency
  type: requires
  explanation: At-least-once redelivery means consumers must handle duplicates.
  chain: async-systems

- from: load-balancing
  to: realtime-communication
  type: requires
  explanation: Long-lived connections need connection-aware balancing and long idle timeouts.
